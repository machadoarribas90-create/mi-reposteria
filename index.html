<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FBF3EC" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mi Repostería" />
  <meta name="description" content="Gestión de repostería offline" />
  <title>Mi Repostería</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #FBF3EC;
      color: #3D2B24;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    #splash {
      position: fixed; inset: 0; background: #FBF3EC;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash.oculto { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #EADFD3;
      border-top-color: #B5542F;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* ── Tema oscuro automático (19:00–6:00) ─────────────────────────────────
       La app está diseñada en claro/cálido de día. Para la noche invertimos
       los colores con un filtro (que con esta paleta cálida da un marrón
       oscuro elegante, no un azul frío) y volvemos a invertir los emojis
       (vía JS, ver el useEffect de corrección de emojis) para que mantengan
       su color natural. Esto evita reescribir cientos de estilos inline y
       mantiene una sola fuente de verdad de diseño. */
    #root.tema-claro {
      filter: invert(1) hue-rotate(180deg);
      background: #FBF3EC;
    }
    body.tema-claro {
      background: #130B04;
    }
    .emoji-fix {
      display: inline-block;
      filter: invert(1) hue-rotate(180deg);
    }
  </style>
</head>
<body>

<div id="splash">
  <div style="font-size:64px">🍰</div>
  <div style="font-size:24px;font-weight:800;font-family:'Fraunces',serif;background:linear-gradient(90deg,#B5542F,#E8B04B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Mi Repostería</div>
  <div style="font-size:12px;color:#8A7A6D">Iniciando…</div>
  <div class="spinner"></div>
</div>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;


// ─── CONSTANTES ───────────────────────────────────────────────────────────────
const TIPOS_MEDIDA = {
  "Peso":     { unidadBase: "kg",      label: "Peso",     unidades: ["kg", "g", "lb", "oz"] },
  "Volumen":  { unidadBase: "l",       label: "Volumen",  unidades: ["l", "ml"] },
  "Unidades": { unidadBase: "unid.",   label: "Unidades", unidades: ["unid.", "par", "set", "paquete"] },
  "Longitud": { unidadBase: "m",       label: "Longitud", unidades: ["m", "cm"] },
  "Paquetes": { unidadBase: "paquete", label: "Paquetes", unidades: ["paquete", "rollo"] },
};

const A_MENOR = {
  kg: 1000, g: 1, lb: 453.592, oz: 28.3495,
  l: 1000,  ml: 1,
  m: 100,   cm: 1,
};

const ESTADOS = {
  pendiente:  { label: "Pendiente",  color: "#C6822A" },
  en_proceso: { label: "En proceso", color: "#6B7BA6" },
  listo:      { label: "Listo",      color: "#6B8E63" },
  entregado:  { label: "Entregado",  color: "#A69686" },
};

// ─── STORAGE ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = "reposteria_v7";
const DEFAULTS = {
  materiales: [],
  recetas: [],
  pedidos: [],
  fondo: { saldoInicial: 0, movimientos: [], porcentajeGlobal: 100 },
};

const loadData = () => {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    return r ? { ...DEFAULTS, ...JSON.parse(r) } : DEFAULTS;
  } catch (e) { return DEFAULTS; }
};

const saveData = (data) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
};

// ─── LICENCIA / ACTIVACIÓN ──────────────────────────────────────────────────────
// Lista de códigos válidos. Cada código se entrega a un cliente al confirmar
// el pago (gestionado por fuera de la app, tú decides cuándo entregarlo).
//
// LÍMITE HONESTO DE ESTE SISTEMA: al no haber un servidor central, no hay
// forma 100% segura de impedir que un código se use en más de un
// dispositivo. Lo que sí hace este mecanismo es subir la barrera: cada
// código queda atado a una "huella" del primer dispositivo donde se activa
// (una combinación de características del navegador/pantalla/hardware). Si
// alguien copia el código Y logra copiar también esa huella exacta a otro
// aparato, igual podría activarlo — pero para uso normal (compartir solo el
// código de palabra o por mensaje) esto ya no alcanza, porque sin la huella
// coincidente la app vuelve a pedir activación.
const CODIGOS_VALIDOS = [
  "RP-339F","RP-33G8","RP-3DNE","RP-4ERF","RP-4ZWJ","RP-5DHQ","RP-5W77","RP-88VF",
  "RP-8LBP","RP-97EF","RP-BT8S","RP-CJU4","RP-D3DQ","RP-D733","RP-EDP9","RP-EGZD",
  "RP-EP2K","RP-EWXY","RP-FMKQ","RP-FSZL","RP-GNZG","RP-H4LX","RP-HH97","RP-J5T4",
  "RP-K94C","RP-KGXS","RP-KGZB","RP-KHVM","RP-L63T","RP-LH9D","RP-N9YB","RP-NR3Q",
  "RP-NY6Y","RP-P6LH","RP-PCF5","RP-PUJR","RP-QA9M","RP-RFV9","RP-SUAK","RP-SYZ8",
  "RP-T8ED","RP-V6U2","RP-WK3D","RP-X6UE","RP-XDGA","RP-Y2QK","RP-YB7Y","RP-YQXQ",
  "RP-ZKBV","RP-ZVRM",
];

const LICENCIA_KEY = "reposteria_licencia_v1";
const HUELLA_KEY   = "reposteria_huella_v1";

const normalizarCodigo = (s) => s.trim().toUpperCase().replace(/\s+/g, "");

// ── Huella del dispositivo ────────────────────────────────────────────────
// Combina varias características estables del navegador/hardware en un solo
// valor. No identifica a la persona ni sale nunca del dispositivo; solo
// sirve para comparar "¿este es el mismo aparato donde se activó el código?".
const generarHuella = () => {
  try {
    const partes = [
      navigator.userAgent || "",
      navigator.language || "",
      String(screen.width) + "x" + String(screen.height),
      String(screen.colorDepth || ""),
      String(navigator.hardwareConcurrency || ""),
      String(navigator.deviceMemory || ""),
      Intl.DateTimeFormat().resolvedOptions().timeZone || "",
    ].join("|");

    // Hash simple (no criptográfico, no hace falta serlo para este uso).
    let hash = 0;
    for (let i = 0; i < partes.length; i++) {
      hash = ((hash << 5) - hash + partes.charCodeAt(i)) | 0;
    }
    return "H" + Math.abs(hash).toString(36);
  } catch (e) { return "H0"; }
};

const getLicenciaActiva = () => {
  try {
    const codigo = localStorage.getItem(LICENCIA_KEY);
    const huella = localStorage.getItem(HUELLA_KEY);
    if (!codigo || !huella) return null;
    // Si la huella guardada no coincide con la del dispositivo actual, se
    // trata como no activado (protege contra copiar el localStorage tal
    // cual a otro aparato para "clonar" la activación).
    if (huella !== generarHuella()) return null;
    return codigo;
  } catch (e) { return null; }
};

const activarLicencia = (codigoIngresado) => {
  const codigo = normalizarCodigo(codigoIngresado);
  if (!CODIGOS_VALIDOS.includes(codigo)) {
    return { ok: false, error: "Código no válido. Revisa que esté escrito igual a como te lo entregaron." };
  }
  try {
    localStorage.setItem(LICENCIA_KEY, codigo);
    localStorage.setItem(HUELLA_KEY, generarHuella());
  } catch (e) {}
  return { ok: true };
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const hoy = () => new Date().toISOString().slice(0, 10);
const f2  = (n) => (+(n || 0)).toFixed(2);

const convertirUnidad = (cantidad, desde, hacia) => {
  if (desde === hacia) return cantidad;
  if (!A_MENOR[desde] || !A_MENOR[hacia]) return cantidad;
  return cantidad * A_MENOR[desde] / A_MENOR[hacia];
};

const precioPromedio = (compras = []) => {
  if (!compras.length) return 0;
  const tc = compras.reduce((s, c) => s + c.cantidad * c.precio, 0);
  const tu = compras.reduce((s, c) => s + c.cantidad, 0);
  return tu ? tc / tu : 0;
};

const stockMaterial = (mat) => {
  const comprado   = (mat.compras    || []).reduce((s, c) => s + c.cantidad, 0);
  const descontado = (mat.descuentos || []).reduce((s, d) => s + d.cantidad, 0);
  return +(comprado - descontado).toFixed(4);
};

const costoReceta = (receta, materiales) =>
  ((receta && receta.ingredientes) || []).reduce((t, ing) => {
    const m = materiales.find(x => x.id === ing.matId);
    return t + (m ? precioPromedio(m.compras) * ing.cantidad : 0);
  }, 0);

const saldoFondo = (fondo) =>
  fondo.movimientos.reduce((s, m) => s + m.monto, +(fondo.saldoInicial || 0));

// ── Stock mínimo helpers ─────────────────────────────────────────────────────
const bajoDeMinimoMat = (mat) => {
  const stock = stockMaterial(mat);
  const min   = +(mat.stockMinimo || 0);
  return min > 0 && stock < min;
};
const faltanteMat = (mat) => {
  const stock = stockMaterial(mat);
  const min   = +(mat.stockMinimo || 0);
  return min > 0 ? Math.max(0, min - stock) : 0;
};
const pctStockMat = (mat) => {
  const stock = stockMaterial(mat);
  const min   = +(mat.stockMinimo || 0);
  if (!min) return null;
  return Math.min(100, Math.round((stock / min) * 100));
};

const unidadesDelTipo = (tipo) =>
  (TIPOS_MEDIDA[tipo] && TIPOS_MEDIDA[tipo].unidades) || [];

// ── Abrir un chat de WhatsApp de forma confiable ──────────────────────────────
// En un navegador normal, wa.me abre WhatsApp directo sin problema. Pero
// dentro de un WebView (como el que genera WebIntoApp al empaquetar la PWA
// como app nativa), wa.me a veces no dispara el intent de Android y termina
// mostrando la página de descarga en vez del chat. La forma estándar de
// Android para resolver justo este caso es el esquema intent://, que trae
// su propio fallback incorporado (S.browser_fallback_url): si WhatsApp está
// instalado lo abre directo, y si no, cae solo al link web sin duplicar
// ventanas ni pantallas de error.
const abrirWhatsApp = (telefono, mensaje) => {
  const texto = encodeURIComponent(mensaje);
  const path  = telefono ? `send?phone=${telefono}&text=${texto}` : `send?text=${texto}`;
  const web   = telefono
    ? `https://api.whatsapp.com/send?phone=${telefono}&text=${texto}`
    : `https://api.whatsapp.com/send?text=${texto}`;
  const intentUrl = `intent://${path}#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=${encodeURIComponent(web)};end`;

  const esAndroid = /Android/i.test(navigator.userAgent);
  if (esAndroid) {
    window.location.href = intentUrl;
  } else {
    // iOS / escritorio: wa.me funciona bien de forma nativa en estos casos.
    window.open(telefono ? `https://wa.me/${telefono}?text=${texto}` : `https://wa.me/?text=${texto}`, "_blank");
  }
};

// ─── ESTILOS BASE ─────────────────────────────────────────────────────────────
const S = {
  card: { background: "#FFFFFF", border: "1px solid #EADFD3", borderRadius: 16, padding: "18px 20px", boxShadow: "0 1px 3px #3D2B2408" },
  inp:  { background: "#FBF3EC", border: "1px solid #E3D5C4", borderRadius: 10, padding: "9px 13px", color: "#3D2B24", fontSize: 14, outline: "none", fontFamily: "inherit", width: "100%", boxSizing: "border-box" },
  lbl:  { fontSize: 11, color: "#9C8676", fontWeight: 700, letterSpacing: 0.6, textTransform: "uppercase", marginBottom: 4, display: "block" },
};

// ─── UI COMPONENTS ────────────────────────────────────────────────────────────
function Fld({ label, error, children }) {
  return (
    <div style={{ display: "flex", flexDirection: "column" }}>
      <label style={S.lbl}>{label}</label>
      {children}
      {error && <div style={{ fontSize: 11, color: "#C94F4F", marginTop: 4, display: "flex", alignItems: "center", gap: 4 }}><span className="emoji-fix">⚠</span> {error}</div>}
    </div>
  );
}

function Inp({ label, error, ...rest }) {
  const [f, sf] = useState(false);
  return (
    <Fld label={label} error={error}>
      <input {...rest}
        style={{ ...S.inp, borderColor: error ? "#C94F4F" : f ? "#B5542F" : "#EADFD3", boxShadow: error ? "0 0 0 1px #C94F4F55" : "none", transition: "border-color .2s, box-shadow .2s", ...rest.style }}
        onFocus={() => sf(true)} onBlur={() => sf(false)} />
    </Fld>
  );
}

function Slct({ label, children, error, ...rest }) {
  return (
    <Fld label={label} error={error}>
      <select {...rest} style={{ ...S.inp, cursor: "pointer", borderColor: error ? "#C94F4F" : "#EADFD3", boxShadow: error ? "0 0 0 1px #C94F4F55" : "none" }}>{children}</select>
    </Fld>
  );
}

function Btn({ v = "primary", sm, style: ex = {}, children, ...rest }) {
  const variants = {
    primary: { background: "linear-gradient(135deg,#B5542F,#C97A54)", color: "#FFFFFF" },
    ghost:   { background: "#EADFD3", color: "#D69B7A" },
    danger:  { background: "#FBEAEA", color: "#C94F4F" },
    success: { background: "#EAF0E6", color: "#6B8E63" },
  };
  return (
    <button {...rest}
      style={{ border: "none", borderRadius: 9, fontFamily: "inherit", fontWeight: 700, cursor: "pointer", fontSize: sm ? 12 : 14, padding: sm ? "5px 11px" : "9px 17px", transition: "opacity .15s", ...variants[v], ...ex }}
      onMouseEnter={e => e.currentTarget.style.opacity = ".75"}
      onMouseLeave={e => e.currentTarget.style.opacity = "1"}>
      {children}
    </button>
  );
}

function Badge({ estado }) {
  const info = ESTADOS[estado] || { label: estado || "", color: "#A69686" };
  return <span style={{ background: info.color + "22", color: info.color, border: "1px solid " + info.color + "44", borderRadius: 20, padding: "2px 10px", fontSize: 11, fontWeight: 700 }}>{info.label}</span>;
}

function Modal({ title, onClose, wide, children }) {
  return (
    <div data-no-swipe="true" style={{ position: "fixed", inset: 0, background: "#3D2B24d9", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{ ...S.card, width: "100%", maxWidth: wide ? 700 : 580, maxHeight: "93vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontWeight: 800, fontSize: 17, color: "#3D2B24" }}>{title}</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#9C8676", fontSize: 20, cursor: "pointer" }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Toast({ msg, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2600); return () => clearTimeout(t); }, []);
  return <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "#EADFD3", border: "1px solid #B5542F", color: "#3D2B24", borderRadius: 12, padding: "10px 22px", fontSize: 14, fontWeight: 600, zIndex: 400, whiteSpace: "nowrap", boxShadow: "0 8px 32px #0006" }}>{msg}</div>;
}

// ── Modal de confirmación reutilizable ────────────────────────────────────────
// ── Pantalla de activación (bloquea la app hasta ingresar código válido) ──────
function PantallaActivacion({ onActivar }) {
  const [codigo, setCodigo] = useState("");
  const [error, setError]   = useState("");
  const [cargando, setCargando] = useState(false);

  const intentar = () => {
    if (!codigo.trim()) { setError("Ingresa el código que te entregaron."); return; }
    setCargando(true);
    setTimeout(() => {
      const res = activarLicencia(codigo);
      setCargando(false);
      if (res.ok) onActivar();
      else setError(res.error);
    }, 300);
  };

  return (
    <div style={{ minHeight: "100vh", background: "#FBF3EC", color: "#3D2B24", fontFamily: "'Inter','Segoe UI',sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 380, textAlign: "center" }}>
        <div style={{ fontSize: 52, marginBottom: 14 }}>🍰</div>
        <div style={{ fontWeight: 600, fontSize: 24, fontFamily: "'Fraunces',serif", background: "linear-gradient(90deg,#3D2B24,#C97A54)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", marginBottom: 6 }}>Mi Repostería</div>
        <div style={{ fontSize: 13, color: "#9C8676", marginBottom: 28, lineHeight: 1.6 }}>
          Ingresa el código de activación que recibiste al adquirir la app.
        </div>

        <div style={{ ...S.card, textAlign: "left" }}>
          <Inp
            label="Código de activación"
            value={codigo}
            onChange={e => { setCodigo(e.target.value); if (error) setError(""); }}
            onKeyDown={e => e.key === "Enter" && intentar()}
            placeholder="RP-XXXX"
            error={error}
            style={{ textTransform: "uppercase", textAlign: "center", fontSize: 18, letterSpacing: 2, fontWeight: 700 }}
          />
          <div style={{ marginTop: 14 }}>
            <Btn onClick={intentar} style={{ width: "100%" }} disabled={cargando}>
              {cargando ? "Verificando…" : "Activar"}
            </Btn>
          </div>
        </div>

        <div style={{ fontSize: 11, color: "#B5A695", marginTop: 20, lineHeight: 1.6 }}>
          ¿No tienes un código? Contacta a quien te compartió esta app para obtener el tuyo.
        </div>
      </div>
    </div>
  );
}


function ConfirmModal({ title = "¿Estás seguro?", message, confirmLabel = "Eliminar", cancelLabel = "Cancelar", danger = true, icon = "🗑", onConfirm, onCancel }) {
  return (
    <div
      data-no-swipe="true"
      style={{ position: "fixed", inset: 0, background: "#3D2B24d9", zIndex: 250, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
      onClick={e => e.target === e.currentTarget && onCancel()}
    >
      <div style={{ ...S.card, width: "100%", maxWidth: 380, textAlign: "center", borderColor: danger ? "#C94F4F55" : "#B5542F55", background: "#FFFFFF" }}>
        <div style={{ fontSize: 40, marginBottom: 10 }}>{icon}</div>
        <div style={{ fontWeight: 800, fontSize: 16, color: "#3D2B24", marginBottom: 8 }}>{title}</div>
        {message && <div style={{ fontSize: 13, color: "#8A7A6D", lineHeight: 1.6, marginBottom: 18 }}>{message}</div>}
        <div style={{ display: "flex", gap: 8 }}>
          <Btn v="ghost" style={{ flex: 1 }} onClick={onCancel}>{cancelLabel}</Btn>
          <Btn v={danger ? "danger" : "primary"} style={{ flex: 1 }} onClick={onConfirm}>{confirmLabel}</Btn>
        </div>
      </div>
    </div>
  );
}

// ── Estado vacío reutilizable ──────────────────────────────────────────────────
function EstadoVacio({ icon = "📭", title, subtitle, actionLabel, onAction }) {
  return (
    <div style={{ ...S.card, textAlign: "center", padding: "40px 20px", borderStyle: "dashed" }}>
      <div style={{ fontSize: 36, marginBottom: 10 }}>{icon}</div>
      <div style={{ color: "#3D2B24", fontSize: 15, fontWeight: 700, marginBottom: 6 }}>{title}</div>
      {subtitle && <div style={{ color: "#9C8676", fontSize: 13, lineHeight: 1.6, maxWidth: 320, margin: "0 auto" }}>{subtitle}</div>}
      {actionLabel && onAction && (
        <div style={{ marginTop: 18 }}>
          <Btn onClick={onAction}>{actionLabel}</Btn>
        </div>
      )}
    </div>
  );
}

function FotoInput({ label = "Foto", foto, onChange }) {
  const kRef = useRef(uid());
  const leer = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 800, canvas = document.createElement("canvas");
        const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        onChange(canvas.toDataURL("image/jpeg", 0.8));
        kRef.current = uid();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };
  return (
    <div>
      <label style={S.lbl}>{label}</label>
      {foto ? (
        <div style={{ position: "relative" }}>
          <img src={foto} alt="" style={{ width: "100%", maxHeight: 200, objectFit: "cover", borderRadius: 10, border: "1px solid #EADFD3", display: "block" }} />
          <button onClick={() => onChange(null)} style={{ position: "absolute", top: 6, right: 6, background: "#FBEAEA", border: "none", color: "#C94F4F", borderRadius: 6, padding: "3px 9px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>✕</button>
        </div>
      ) : (
        <div style={{ display: "flex", gap: 8 }}>
          <label style={{ ...S.inp, width: "auto", cursor: "pointer", padding: "8px 14px", fontSize: 13, fontWeight: 600, color: "#D69B7A", display: "inline-flex", alignItems: "center", gap: 6 }}>
            🖼 Galería <input key={kRef.current + "g"} type="file" accept="image/*" style={{ display: "none" }} onChange={e => leer(e.target.files[0])} />
          </label>
          <label style={{ ...S.inp, width: "auto", cursor: "pointer", padding: "8px 14px", fontSize: 13, fontWeight: 600, color: "#D69B7A", display: "inline-flex", alignItems: "center", gap: 6 }}>
            📷 Cámara <input key={kRef.current + "c"} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={e => leer(e.target.files[0])} />
          </label>
        </div>
      )}
    </div>
  );
}

function FotoThumb({ foto, alt = "" }) {
  const [open, setOpen] = useState(false);
  if (!foto) return null;
  return (
    <div>
      <img src={foto} alt={alt} onClick={() => setOpen(true)} style={{ width: "100%", borderRadius: 10, marginBottom: 10, cursor: "zoom-in", maxHeight: 180, objectFit: "cover", border: "1px solid #EADFD3" }} />
      {open && (
        <div onClick={() => setOpen(false)} style={{ position: "fixed", inset: 0, background: "#2A1810cc", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <img src={foto} alt="" style={{ maxWidth: "100%", maxHeight: "90vh", borderRadius: 12 }} />
        </div>
      )}
    </div>
  );
}

// ─── MÓDULO: Inventario / Materiales ─────────────────────────────────────────
function MaterialesModule({ materiales, setMateriales, fondo, setFondo, toast }) {
  const BLANK_MAT = { nombre: "", tipo: "Peso", unidad: "kg", stockMinimo: "" };
  const [showAdd, setShowAdd]         = useState(false);
  const [editId, setEditId]           = useState(null);
  const [form, setForm]               = useState(BLANK_MAT);
  const [showCompra, setShowCompra]   = useState(null);
  const [historialId, setHistorialId] = useState(null);
  const [cf, setCf] = useState({ fecha: hoy(), cantidad: "", precioTotal: "", unidadCompra: "", nota: "" });
  const [busqueda, setBusqueda] = useState("");
  const [soloBajo, setSoloBajo] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDeleteCompra, setConfirmDeleteCompra] = useState(null);
  const [errores, setErrores]   = useState({});

  const saldo = saldoFondo(fondo);

  const guardarMat = () => {
    const errs = {};
    if (!form.nombre.trim()) errs.nombre = "Ingresa un nombre para el material.";
    if (Object.keys(errs).length) { setErrores(errs); return; }
    setErrores({});
    const min = form.stockMinimo !== "" ? +form.stockMinimo : 0;
    if (editId) {
      setMateriales(p => p.map(x => x.id === editId ? { ...x, nombre: form.nombre.trim(), tipo: form.tipo, unidad: form.unidad, stockMinimo: min } : x));
      toast("✅ Material actualizado"); setEditId(null);
    } else {
      setMateriales(p => [...p, { id: uid(), nombre: form.nombre.trim(), tipo: form.tipo, unidad: form.unidad, stockMinimo: min, compras: [], descuentos: [] }]);
      toast("✅ Material agregado"); setShowAdd(false);
    }
    setForm(BLANK_MAT);
  };

  const eliminarMat = (id) => {
    setMateriales(p => p.filter(x => x.id !== id));
    toast("🗑 Material eliminado");
  };

  const registrarCompra = (id) => {
    if (!cf.cantidad || !cf.precioTotal) return;
    const mat = materiales.find(m => m.id === id);
    if (!mat) return;
    const unidadUsada   = cf.unidadCompra || mat.unidad;
    const cantidadBase  = convertirUnidad(+cf.cantidad, unidadUsada, mat.unidad);
    const monto         = +cf.precioTotal;
    const precioPorUnit = cantidadBase > 0 ? monto / cantidadBase : 0;
    const compraId      = uid();

    setMateriales(p => p.map(m => m.id !== id ? m : {
      ...m,
      compras: [...(m.compras || []), {
        id: compraId, fecha: cf.fecha,
        cantidad: cantidadBase, precio: precioPorUnit,
        cantidadOriginal: +cf.cantidad, unidadOriginal: unidadUsada,
        precioTotal: monto, nota: cf.nota,
      }],
    }));

    setFondo(f => ({
      ...f,
      movimientos: [...f.movimientos, {
        id: uid(), tipo: "compra", monto: -monto,
        descripcion: `Compra: ${mat.nombre} ${cf.cantidad} ${unidadUsada} — $${f2(monto)}`,
        fecha: cf.fecha, ref: compraId, matId: id,
      }],
    }));

    setCf({ fecha: hoy(), cantidad: "", precioTotal: "", unidadCompra: "", nota: "" });
    setShowCompra(null);
    toast("📦 Compra registrada");
  };

  // ── Eliminar una compra puntual (sin afectar el resto del material) ──
  // Revierte también el movimiento de caja asociado, si existe.
  const eliminarCompra = (matId, compra) => {
    setMateriales(p => p.map(m => m.id !== matId ? m : {
      ...m,
      compras: (m.compras || []).filter(c => c.id !== compra.id),
    }));

    setFondo(f => {
      // 1) Coincidencia exacta por ref (compras registradas después de este cambio)
      let idx = f.movimientos.findIndex(mv => mv.ref === compra.id);
      // 2) Fallback para compras antiguas: mismo material, mismo monto y fecha
      if (idx === -1) {
        const monto = compra.precioTotal || compra.cantidad * compra.precio;
        idx = f.movimientos.findIndex(mv =>
          mv.tipo === "compra" && mv.ref === matId &&
          mv.fecha === compra.fecha && Math.abs(mv.monto + monto) < 0.005
        );
      }
      if (idx === -1) return f;
      return { ...f, movimientos: f.movimientos.filter((_, i) => i !== idx) };
    });

    toast("🗑 Compra eliminada");
  };

  const matHistorial = historialId ? materiales.find(m => m.id === historialId) : null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <h2 style={{ margin: 0, fontSize: 21, color: "#3D2B24", fontFamily: "'Fraunces',serif", fontWeight: 600 }}>Inventario</h2>
          <p style={{ margin: "3px 0 0", fontSize: 12, color: "#9C8676" }}>Toca un material para ver su historial de compras.</p>
        </div>
        <Btn onClick={() => { setShowAdd(s => !s); setForm(BLANK_MAT); setEditId(null); setErrores({}); }}>+ Agregar</Btn>
      </div>

      {/* Barra de búsqueda + filtro bajo */}
      {materiales.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", fontSize: 15, color: "#9C8676", pointerEvents: "none" }}>🔍</span>
            <input
              value={busqueda}
              onChange={e => setBusqueda(e.target.value)}
              placeholder="Buscar material…"
              style={{ ...S.inp, paddingLeft: 36 }}
            />
            {busqueda && (
              <button onClick={() => setBusqueda("")} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#9C8676", cursor: "pointer", fontSize: 16, lineHeight: 1 }}>✕</button>
            )}
          </div>
          {/* Chips de filtro */}
          {(() => {
            const nBajo = materiales.filter(m => bajoDeMinimoMat(m)).length;
            return nBajo > 0 ? (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button
                  onClick={() => setSoloBajo(s => !s)}
                  style={{
                    background: soloBajo ? "#C94F4F22" : "#FFFFFF",
                    border: `1px solid ${soloBajo ? "#C94F4F" : "#EADFD3"}`,
                    borderRadius: 20,
                    padding: "5px 14px",
                    color: soloBajo ? "#C94F4F" : "#9C8676",
                    fontSize: 12,
                    fontWeight: 700,
                    cursor: "pointer",
                    fontFamily: "inherit",
                    display: "flex",
                    alignItems: "center",
                    gap: 6,
                    transition: "all .15s",
                  }}
                >
                  <span>⚠</span>
                  <span>Solo bajo mínimo</span>
                  <span style={{ background: soloBajo ? "#C94F4F" : "#EADFD3", color: soloBajo ? "#FFFFFF" : "#8A7A6D", borderRadius: 10, padding: "1px 7px", fontSize: 11 }}>{nBajo}</span>
                </button>
                {soloBajo && (
                  <button onClick={() => setSoloBajo(false)} style={{ background: "none", border: "1px solid #EADFD3", borderRadius: 20, padding: "5px 12px", color: "#A69686", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
                    Mostrar todos
                  </button>
                )}
              </div>
            ) : null;
          })()}
        </div>
      )}

      {/* Formulario agregar/editar */}
      {(showAdd || editId) && (
        <div style={{ ...S.card, borderColor: "#B5542F55" }}>
          <div style={{ fontWeight: 700, color: "#3D2B24", marginBottom: 12 }}>{editId ? "Editar material" : "Nuevo material"}</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Inp label="Nombre" value={form.nombre} onChange={e => { setForm({ ...form, nombre: e.target.value }); if (errores.nombre) setErrores({}); }} placeholder="Ej: Harina, Huevos…" error={errores.nombre} />
            <Slct label="Se mide por…" value={form.tipo} onChange={e => {
              const tipo = e.target.value;
              setForm({ ...form, tipo, unidad: (TIPOS_MEDIDA[tipo] && TIPOS_MEDIDA[tipo].unidadBase) || "unid." });
            }}>
              {Object.keys(TIPOS_MEDIDA).map(t => <option key={t} value={t}>{TIPOS_MEDIDA[t].label}</option>)}
            </Slct>
            <div style={{ gridColumn: "1/-1" }}>
              <Inp
                label={`Stock mínimo (${form.unidad}) — alerta cuando baje de este nivel`}
                type="number"
                min="0"
                step="any"
                value={form.stockMinimo}
                onChange={e => setForm({ ...form, stockMinimo: e.target.value })}
                placeholder="0 = sin alerta"
              />
            </div>
          </div>
          <div style={{ marginTop: 8, fontSize: 12, color: "#9C8676", background: "#FBF3EC", borderRadius: 8, padding: "7px 12px" }}>
            Unidad base: <b style={{ color: "#D69B7A" }}>{form.unidad}</b> — al registrar compras puedes indicar en cualquier unidad compatible.
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <Btn onClick={guardarMat}>Guardar</Btn>
            <Btn v="ghost" onClick={() => { setShowAdd(false); setEditId(null); setForm(BLANK_MAT); setErrores({}); }}>Cancelar</Btn>
          </div>
        </div>
      )}

      {/* Estado vacío */}
      {materiales.length === 0 && !showAdd && (
        <EstadoVacio
          icon="🧂"
          title="Aún no tienes materiales"
          subtitle="Agrega aquí todos tus ingredientes: harina, azúcar, huevos, mantequilla… Cada uno con su stock y precio."
          actionLabel="+ Agregar primer material"
          onAction={() => setShowAdd(true)}
        />
      )}

      {/* Modal historial */}
      {matHistorial && (
        <Modal title={`📋 ${matHistorial.nombre} — historial de compras`} onClose={() => setHistorialId(null)}>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
              {[
                { label: "STOCK ACTUAL",   val: `${stockMaterial(matHistorial).toFixed(4)} ${matHistorial.unidad}`, color: "#8FAE87" },
                { label: "PRECIO PROM.",   val: `$${precioPromedio(matHistorial.compras).toFixed(4)}/${matHistorial.unidad}`, color: "#D69B7A" },
                { label: "TOTAL GASTADO",  val: `$${f2(matHistorial.compras.reduce((s, c) => s + (c.precioTotal || c.cantidad * c.precio), 0))}`, color: "#C94F4F" },
              ].map(item => (
                <div key={item.label} style={{ ...S.card, padding: "12px 14px", textAlign: "center" }}>
                  <div style={{ fontSize: 10, color: "#9C8676", fontWeight: 700 }}>{item.label}</div>
                  <div style={{ fontSize: 14, fontWeight: 800, color: item.color, marginTop: 4 }}>{item.val}</div>
                </div>
              ))}
            </div>
            {matHistorial.compras.length === 0 && (
              <div style={{ textAlign: "center", color: "#9C8676", padding: "24px 0", fontSize: 13 }}>Sin compras registradas aún.</div>
            )}
            {[...matHistorial.compras].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).map((c, idx) => {
              const monto = c.precioTotal || c.cantidad * c.precio;
              const tieneOriginal = c.cantidadOriginal && c.unidadOriginal && c.unidadOriginal !== matHistorial.unidad;
              return (
                <div key={c.id || idx} style={{ ...S.card, padding: "12px 16px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: "#3D2B24" }}>
                        {tieneOriginal
                          ? `${c.cantidadOriginal} ${c.unidadOriginal} → ${c.cantidad.toFixed(4)} ${matHistorial.unidad}`
                          : `${c.cantidad.toFixed(4)} ${matHistorial.unidad}`}
                      </div>
                      <div style={{ fontSize: 11, color: "#A69686", marginTop: 3 }}>{c.fecha} · ${c.precio.toFixed(4)}/{matHistorial.unidad}</div>
                      {c.nota && <div style={{ fontSize: 11, color: "#8A7A6D", marginTop: 2 }}>💬 {c.nota}</div>}
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
                      <div>
                        <div style={{ fontSize: 16, fontWeight: 800, color: "#C94F4F" }}>${f2(monto)}</div>
                        <div style={{ fontSize: 10, color: "#A69686" }}>total pagado</div>
                      </div>
                      <Btn sm v="danger" onClick={() => setConfirmDeleteCompra({ matId: matHistorial.id, compra: c })}>🗑</Btn>
                    </div>
                  </div>
                </div>
              );
            })}
            <Btn v="ghost" onClick={() => setHistorialId(null)}>Cerrar</Btn>
          </div>
        </Modal>
      )}

      {/* Confirmación de eliminación de una compra puntual */}
      {confirmDeleteCompra && (
        <ConfirmModal
          icon="📦"
          title="¿Eliminar esta compra?"
          message="Se quitará del historial del material y se revertirá su movimiento en el fondo de caja, si existe. Esta acción no se puede deshacer."
          confirmLabel="Eliminar"
          onCancel={() => setConfirmDeleteCompra(null)}
          onConfirm={() => { eliminarCompra(confirmDeleteCompra.matId, confirmDeleteCompra.compra); setConfirmDeleteCompra(null); }}
        />
      )}

      {/* Sin resultados */}
      {busqueda && materiales.filter(m => m.nombre.toLowerCase().includes(busqueda.toLowerCase())).length === 0 && (
        <div style={{ textAlign: "center", color: "#9C8676", padding: "32px 0", fontSize: 14 }}>
          Sin resultados para "<b style={{ color: "#3D2B24" }}>{busqueda}</b>"
        </div>
      )}

      {/* Tarjetas */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(275px,1fr))", gap: 12 }}>
        {materiales.filter(m =>
            m.nombre.toLowerCase().includes(busqueda.toLowerCase()) &&
            (!soloBajo || bajoDeMinimoMat(m))
          ).map(mat => {
          const stock = stockMaterial(mat);
          const pp    = precioPromedio(mat.compras);
          const bajo  = bajoDeMinimoMat(mat);
          const faltante = faltanteMat(mat);
          const pctStock = pctStockMat(mat);
          const ult   = [...(mat.compras || [])].sort((a, b) => new Date(b.fecha) - new Date(a.fecha))[0];

          return (
            <div key={mat.id} style={{ ...S.card, borderColor: bajo ? "#C94F4F55" : "#EADFD3", cursor: "pointer" }}
              onClick={() => setHistorialId(mat.id)}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 15, color: "#3D2B24" }}>{mat.nombre}</div>
                  <div style={{ fontSize: 11, color: "#9C8676", marginTop: 1 }}>{mat.tipo}</div>
                  <div style={{ fontSize: 13, marginTop: 6 }}>
                    Stock: <span style={{ color: bajo ? "#C94F4F" : stock === 0 && !mat.compras.length ? "#B5A695" : "#8FAE87", fontWeight: 700 }}>{stock.toFixed(4)} {mat.unidad}</span>
                    {bajo && <span style={{ marginLeft: 6, fontSize: 10, background: "#C94F4F22", color: "#C94F4F", border: "1px solid #C94F4F44", borderRadius: 8, padding: "1px 6px", fontWeight: 700 }}>⚠ BAJO</span>}
                    {!mat.compras.length && <span style={{ marginLeft: 6, fontSize: 11, color: "#B5A695" }}>sin compras</span>}
                  </div>
                  {/* Barra de stock mínimo */}
                  {pctStock !== null && (
                    <div style={{ marginTop: 8 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#A69686", marginBottom: 3 }}>
                        <span>Mín: {mat.stockMinimo} {mat.unidad}</span>
                        <span style={{ color: pctStock < 25 ? "#C94F4F" : pctStock < 60 ? "#D99A34" : "#6B8E63", fontWeight: 700 }}>{pctStock}%</span>
                      </div>
                      <div style={{ height: 5, borderRadius: 3, background: "#EADFD3", overflow: "hidden" }}>
                        <div style={{
                          height: "100%",
                          width: pctStock + "%",
                          borderRadius: 3,
                          background: pctStock < 25 ? "#C94F4F" : pctStock < 60 ? "#D99A34" : "#6B8E63",
                          transition: "width .4s",
                        }} />
                      </div>
                      {bajo && faltante > 0 && (
                        <div style={{ fontSize: 10, color: "#D99A34", marginTop: 3 }}>
                          Faltan <b>{faltante.toFixed(4)} {mat.unidad}</b> para llegar al mínimo
                        </div>
                      )}
                    </div>
                  )}
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 16, fontWeight: 800, color: pp > 0 ? "#D69B7A" : "#B5A695" }}>${pp.toFixed(4)}</div>
                  <div style={{ fontSize: 10, color: "#A69686" }}>/{mat.unidad}</div>
                  {pp > 0 && <div style={{ fontSize: 11, color: "#9C8676" }}>Val: ${f2(stock * pp)}</div>}
                </div>
              </div>

              {ult && (
                <div style={{ fontSize: 11, color: "#A69686", borderTop: "1px solid #EADFD3", marginTop: 10, paddingTop: 8 }}>
                  Última compra {ult.fecha}:{" "}
                  {ult.cantidadOriginal && ult.unidadOriginal && ult.unidadOriginal !== mat.unidad
                    ? `${ult.cantidadOriginal} ${ult.unidadOriginal} → ${ult.cantidad.toFixed(4)} ${mat.unidad}`
                    : `${ult.cantidad.toFixed(4)} ${mat.unidad}`}
                  {" — "}<b style={{ color: "#C94F4F" }}>${f2(ult.precioTotal || ult.cantidad * ult.precio)}</b>
                  {ult.nota ? ` · ${ult.nota}` : ""}
                </div>
              )}

              {/* Acciones */}
              <div style={{ marginTop: 10 }} onClick={e => e.stopPropagation()}>
                {showCompra === mat.id ? (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      <Inp label="Fecha" type="date" value={cf.fecha} onChange={e => setCf({ ...cf, fecha: e.target.value })} />
                      <Slct label="Unidad de compra" value={cf.unidadCompra || mat.unidad} onChange={e => setCf({ ...cf, unidadCompra: e.target.value })}>
                        {unidadesDelTipo(mat.tipo).map(u => <option key={u} value={u}>{u}{u === mat.unidad ? " (base)" : ""}</option>)}
                      </Slct>
                      <Inp label={`Cantidad (${cf.unidadCompra || mat.unidad})`} type="number" value={cf.cantidad} onChange={e => setCf({ ...cf, cantidad: e.target.value })} placeholder="0" />
                      <Inp label="Total pagado $" type="number" value={cf.precioTotal} onChange={e => setCf({ ...cf, precioTotal: e.target.value })} placeholder="0.00" />
                    </div>
                    <Inp label="Nota (opcional)" value={cf.nota} onChange={e => setCf({ ...cf, nota: e.target.value })} placeholder="Ej: oferta, mercado..." />
                    {cf.cantidad && cf.precioTotal && (() => {
                      const u   = cf.unidadCompra || mat.unidad;
                      const cb  = convertirUnidad(+cf.cantidad, u, mat.unidad);
                      const ppu = cb > 0 ? +cf.precioTotal / cb : 0;
                      return (
                        <div style={{ fontSize: 12, color: "#8A7A6D", background: "#FBF3EC", borderRadius: 7, padding: "8px 12px" }}>
                          {u !== mat.unidad && <div>Equivale a: <b style={{ color: "#D69B7A" }}>{cb.toFixed(4)} {mat.unidad}</b></div>}
                          <div>Precio por {mat.unidad}: <b style={{ color: "#D69B7A" }}>${ppu.toFixed(4)}</b></div>
                          <div>Total: <b style={{ color: "#C94F4F" }}>${f2(+cf.precioTotal)}</b> · Fondo después: <b style={{ color: (saldo - +cf.precioTotal) >= 0 ? "#6B8E63" : "#C94F4F" }}>${f2(saldo - +cf.precioTotal)}</b></div>
                        </div>
                      );
                    })()}
                    <div style={{ display: "flex", gap: 6 }}>
                      <Btn sm v="success" onClick={() => registrarCompra(mat.id)}>✓ Registrar compra</Btn>
                      <Btn sm v="ghost" onClick={() => setShowCompra(null)}>Cancelar</Btn>
                    </div>
                  </div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      <Btn sm v="ghost" onClick={() => { setShowCompra(mat.id); setCf({ fecha: hoy(), cantidad: "", precioTotal: "", unidadCompra: "", nota: "" }); }}>📦 Registrar compra</Btn>
                      <Btn sm v="ghost" onClick={() => { setForm({ nombre: mat.nombre, tipo: mat.tipo || "Peso", unidad: mat.unidad, stockMinimo: mat.stockMinimo != null ? mat.stockMinimo : "" }); setEditId(mat.id); setShowAdd(false); setErrores({}); }}>✏️</Btn>
                      <Btn sm v="danger" onClick={() => setConfirmDelete(mat)}>🗑</Btn>
                    </div>

                    {/* Toggle agregado */}
                    <div style={{ borderTop: "1px solid #EADFD3", paddingTop: 8 }}>
                      <button
                        onClick={() => setMateriales(p => p.map(m => m.id !== mat.id ? m : { ...m, esAgregado: !m.esAgregado, precioAgregado: m.esAgregado ? 0 : (m.precioAgregado || 0) }))}
                        style={{ display: "flex", alignItems: "center", gap: 8, background: mat.esAgregado ? "#FBF0DC" : "transparent", border: `1px solid ${mat.esAgregado ? "#C6822A" : "#EADFD3"}`, color: mat.esAgregado ? "#D99A34" : "#A69686", borderRadius: 8, padding: "5px 10px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", width: "100%", textAlign: "left" }}>
                        <span style={{ fontSize: 15 }}>{mat.esAgregado ? "☑" : "☐"}</span>
                        <span>Disponible como agregado en pedidos</span>
                      </button>
                      {mat.esAgregado && (
                        <div style={{ marginTop: 6, display: "flex", alignItems: "center", gap: 8 }}>
                          <label style={{ ...S.lbl, margin: 0, whiteSpace: "nowrap" }}>Precio agregado $</label>
                          <input
                            type="number"
                            value={mat.precioAgregado || ""}
                            placeholder="0.00"
                            onChange={e => setMateriales(p => p.map(m => m.id !== mat.id ? m : { ...m, precioAgregado: +e.target.value }))}
                            style={{ ...S.inp, width: 100 }}
                          />
                          {mat.precioAgregado > 0 && <span style={{ fontSize: 12, color: "#6B8E63", fontWeight: 700, whiteSpace: "nowrap" }}>+${f2(mat.precioAgregado)}</span>}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* Confirmación de eliminación */}
      {confirmDelete && (
        <ConfirmModal
          icon="🧂"
          title={`¿Eliminar "${confirmDelete.nombre}"?`}
          message={confirmDelete.compras && confirmDelete.compras.length > 0
            ? `Se perderá el historial de ${confirmDelete.compras.length} compra(s) registradas. Esta acción no se puede deshacer.`
            : "Esta acción no se puede deshacer."}
          confirmLabel="Eliminar"
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => { eliminarMat(confirmDelete.id); setConfirmDelete(null); }}
        />
      )}
    </div>
  );
}
// ─── MÓDULO: Recetas ──────────────────────────────────────────────────────────
function RecetasModule({ recetas, setRecetas, materiales, toast }) {
  const [editando, setEditando] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [ingF, setIngF]         = useState({ matId: "", cantidad: "", unidad: "" });
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [orden, setOrden]       = useState("nombre");
  const [errores, setErrores]   = useState({});

  const abrirNueva  = () => { setEditando({ id: null, nombre: "", descripcion: "", ingredientes: [], margen: 40, foto: null }); setErrores({}); };
  const abrirEditar = (r) => { setEditando({ ...r, margen: +(r.margen * 100).toFixed(1), ingredientes: r.ingredientes.map(i => ({ ...i, _key: i._key || uid() })) }); setErrores({}); };

  const guardar = () => {
    const errs = {};
    if (!editando.nombre.trim()) errs.nombre = "Ingresa un nombre para la receta.";
    if (!editando.ingredientes.length) errs.ingredientes = "Agrega al menos un ingrediente.";
    if (Object.keys(errs).length) { setErrores(errs); return; }
    setErrores({});
    const obj = { ...editando, margen: editando.margen / 100 };
    if (!obj.id) { setRecetas(p => [...p, { ...obj, id: uid() }]); toast("✅ Receta creada"); }
    else          { setRecetas(p => p.map(r => r.id === obj.id ? obj : r)); toast("✅ Receta actualizada"); }
    setEditando(null);
  };

  const eliminar  = (id) => { setRecetas(p => p.filter(r => r.id !== id)); toast("🗑 Receta eliminada"); };
  const removeIng = (key) => setEditando(e => ({ ...e, ingredientes: e.ingredientes.filter(i => i._key !== key) }));

  const addIng = () => {
    if (!ingF.matId || !ingF.cantidad) return;
    const mat = materiales.find(m => m.id === ingF.matId);
    if (!mat) return;
    const unidadUsada  = ingF.unidad || mat.unidad;
    const cantidadBase = convertirUnidad(+ingF.cantidad, unidadUsada, mat.unidad);
    setEditando(e => ({
      ...e,
      ingredientes: [...e.ingredientes, { _key: uid(), matId: ingF.matId, cantidad: cantidadBase, cantidadOriginal: +ingF.cantidad, unidadOriginal: unidadUsada }],
    }));
    setIngF({ matId: "", cantidad: "", unidad: "" });
    if (errores.ingredientes) setErrores(er => ({ ...er, ingredientes: null }));
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h2 style={{ margin: 0, fontSize: 21, color: "#3D2B24", fontFamily: "'Fraunces',serif", fontWeight: 600 }}>Recetas</h2>
        <Btn onClick={abrirNueva}>+ Nueva</Btn>
      </div>

      {/* Modal nueva/editar receta */}
      {editando && (
        <Modal title={editando.id ? "Editar receta" : "Nueva receta"} onClose={() => { setEditando(null); setErrores({}); }} wide>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Inp label="Nombre" value={editando.nombre} onChange={e => { setEditando(d => ({ ...d, nombre: e.target.value })); if (errores.nombre) setErrores(er => ({ ...er, nombre: null })); }} placeholder="Ej: Torta de zanahoria" error={errores.nombre} />
            <Inp label="Descripción" value={editando.descripcion} onChange={e => setEditando(d => ({ ...d, descripcion: e.target.value }))} placeholder="Ej: Con frosting de queso crema" />
            <Inp label="Margen de ganancia (%)" type="number" value={editando.margen} onChange={e => setEditando(d => ({ ...d, margen: e.target.value }))} />

            {/* Foto solo desde galería */}
            <div>
              <label style={S.lbl}>Foto de referencia</label>
              {editando.foto ? (
                <div style={{ position: "relative" }}>
                  <img src={editando.foto} alt="" style={{ width: "100%", maxHeight: 200, objectFit: "cover", borderRadius: 10, border: "1px solid #EADFD3", display: "block" }} />
                  <button onClick={() => setEditando(d => ({ ...d, foto: null }))} style={{ position: "absolute", top: 6, right: 6, background: "#FBEAEA", border: "none", color: "#C94F4F", borderRadius: 6, padding: "3px 9px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>✕</button>
                </div>
              ) : (
                <label style={{ ...S.inp, cursor: "pointer", padding: "8px 14px", fontSize: 13, fontWeight: 600, color: "#D69B7A", display: "inline-flex", alignItems: "center", gap: 6 }}>
                  🖼 Seleccionar desde galería
                  <input type="file" accept="image/*" style={{ display: "none" }} onChange={e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = ev => {
                      const img = new Image();
                      img.onload = () => {
                        const MAX = 800, canvas = document.createElement("canvas");
                        const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
                        canvas.width = Math.round(img.width * ratio);
                        canvas.height = Math.round(img.height * ratio);
                        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                        setEditando(d => ({ ...d, foto: canvas.toDataURL("image/jpeg", 0.8) }));
                      };
                      img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                  }} />
                </label>
              )}
            </div>

            <div style={{ borderTop: "1px solid #EADFD3", paddingTop: 12 }}>
              <label style={S.lbl}>Ingredientes <span style={{ color: "#A69686", fontSize: 10, textTransform: "none", fontWeight: 400 }}>(puedes repetir el mismo material)</span></label>
              {errores.ingredientes && <div style={{ fontSize: 11, color: "#C94F4F", marginBottom: 8, display: "flex", alignItems: "center", gap: 4 }}><span className="emoji-fix">⚠</span> {errores.ingredientes}</div>}
              {materiales.length === 0 && <div style={{ fontSize: 12, color: "#C94F4F", marginBottom: 8 }}>⚠ Primero agrega materiales en Inventario.</div>}

              {editando.ingredientes.map(ing => {
                const mat    = materiales.find(m => m.id === ing.matId);
                const ppu    = mat ? precioPromedio(mat.compras) : 0;
                const conv   = ing.cantidadOriginal && ing.unidadOriginal && ing.unidadOriginal !== (mat && mat.unidad);
                const label  = conv
                  ? `${ing.cantidadOriginal} ${ing.unidadOriginal} → ${ing.cantidad.toFixed(4)} ${(mat && mat.unidad) || ""}`
                  : `${ing.cantidad.toFixed(4)} ${(mat && mat.unidad) || ""}`;
                return (
                  <div key={ing._key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 10px", background: "#FBF3EC", borderRadius: 8, marginBottom: 6 }}>
                    <span style={{ fontSize: 13, color: "#C9BBA9" }}>{(mat && mat.nombre) || "?"} — {label}</span>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 12, color: "#9C8676" }}>${f2(ppu * ing.cantidad)}</span>
                      <button onClick={() => removeIng(ing._key)} style={{ background: "none", border: "none", color: "#C94F4F", cursor: "pointer", fontSize: 15 }}>✕</button>
                    </div>
                  </div>
                );
              })}

              {/* Selector añadir ingrediente */}
              {materiales.length > 0 && (() => {
                const matSel      = materiales.find(m => m.id === ingF.matId);
                const unidades    = matSel ? unidadesDelTipo(matSel.tipo) : [];
                const unidadActual = ingF.unidad || (matSel && matSel.unidad) || "";
                const cantBase    = matSel && ingF.cantidad && unidadActual ? convertirUnidad(+ingF.cantidad, unidadActual, matSel.unidad) : 0;
                const ppu         = matSel ? precioPromedio(matSel.compras) : 0;
                return (
                  <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 8 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr auto", gap: 8, alignItems: "flex-end" }}>
                      <Slct label="Material" value={ingF.matId} onChange={e => setIngF({ matId: e.target.value, cantidad: "", unidad: "" })}>
                        <option value="">Seleccionar…</option>
                        {materiales.map(m => <option key={m.id} value={m.id}>{m.nombre}</option>)}
                      </Slct>
                      <Slct label="Unidad" value={unidadActual} onChange={e => setIngF(f => ({ ...f, unidad: e.target.value }))}>
                        {unidades.length === 0 && <option value="">—</option>}
                        {unidades.map(u => <option key={u} value={u}>{u}{matSel && u === matSel.unidad ? " (base)" : ""}</option>)}
                      </Slct>
                      <Inp label="Cantidad" type="number" value={ingF.cantidad} onChange={e => setIngF(f => ({ ...f, cantidad: e.target.value }))} placeholder="0" />
                      <Btn sm v="ghost" onClick={addIng} style={{ alignSelf: "flex-end", padding: "9px 14px" }}>+</Btn>
                    </div>
                    {matSel && ingF.cantidad && unidadActual && (
                      <div style={{ fontSize: 11, color: "#8A7A6D", background: "#FBF3EC", borderRadius: 7, padding: "5px 10px" }}>
                        {unidadActual !== matSel.unidad
                          ? <>Equivale a <b style={{ color: "#D69B7A" }}>{cantBase.toFixed(4)} {matSel.unidad}</b> · </>
                          : null}
                        {ppu > 0 && <>Costo: <b style={{ color: "#C97A54" }}>${f2(ppu * cantBase)}</b></>}
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <Btn onClick={guardar}>Guardar receta</Btn>
              <Btn v="ghost" onClick={() => { setEditando(null); setErrores({}); }}>Cancelar</Btn>
            </div>
          </div>
        </Modal>
      )}

      {recetas.length === 0 && (
        <EstadoVacio
          icon="📋"
          title="Aún no tienes recetas"
          subtitle="Crea tu primera receta agregando ingredientes desde tu inventario, así calcularás automáticamente el costo y precio sugerido."
          actionLabel="+ Crear primera receta"
          onAction={abrirNueva}
        />
      )}

      {/* Selector de orden */}
      {recetas.length > 1 && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
          <span style={{ fontSize: 11, color: "#9C8676", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5 }}>Ordenar por:</span>
          {[
            { id: "nombre",  label: "Nombre" },
            { id: "margen",  label: "Margen ▼" },
            { id: "costo",   label: "Costo ▼" },
            { id: "precio",  label: "Precio ▼" },
          ].map(o => (
            <button key={o.id} onClick={() => setOrden(o.id)} style={{ background: orden === o.id ? "#B5542F" : "#FFFFFF", border: `1px solid ${orden === o.id ? "#B5542F" : "#EADFD3"}`, color: orden === o.id ? "#FFFFFF" : "#9C8676", borderRadius: 20, padding: "5px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
              {o.label}
            </button>
          ))}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(290px,1fr))", gap: 12 }}>
        {recetas.slice().sort((a, b) => {
          if (orden === "nombre") return a.nombre.localeCompare(b.nombre);
          if (orden === "margen") return b.margen - a.margen;
          const costoA = costoReceta(a, materiales), costoB = costoReceta(b, materiales);
          if (orden === "costo")  return costoB - costoA;
          if (orden === "precio") return (costoB * (1 + b.margen)) - (costoA * (1 + a.margen));
          return 0;
        }).map(r => {
          const costo = costoReceta(r, materiales);
          const open  = expanded === r.id;
          return (
            <div key={r.id} style={{ ...S.card }}>
              {r.foto && <FotoThumb foto={r.foto} alt={r.nombre} />}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div style={{ flex: 1, cursor: "pointer" }} onClick={() => setExpanded(open ? null : r.id)}>
                  <div style={{ fontWeight: 700, fontSize: 15, color: "#3D2B24" }}>{r.nombre} <span style={{ fontSize: 11, color: "#9C8676" }}>{open ? "▲" : "▼"}</span></div>
                  <div style={{ fontSize: 12, color: "#9C8676", marginTop: 2 }}>{r.descripcion}</div>
                </div>
                <div style={{ display: "flex", gap: 6, marginLeft: 8 }}>
                  <Btn sm v="ghost" onClick={() => abrirEditar(r)}>✏️</Btn>
                  <Btn sm v="danger" onClick={() => setConfirmDelete(r)}>🗑</Btn>
                </div>
              </div>
              <div style={{ display: "flex", gap: 16, marginTop: 12 }}>
                <div><div style={{ fontSize: 10, color: "#9C8676" }}>COSTO</div><div style={{ fontWeight: 800, color: "#C94F4F", fontSize: 15 }}>${f2(costo)}</div></div>
                <div><div style={{ fontSize: 10, color: "#9C8676" }}>PRECIO BASE</div><div style={{ fontWeight: 800, color: "#6B8E63", fontSize: 15 }}>${f2(costo * (1 + r.margen))}</div></div>
                <div><div style={{ fontSize: 10, color: "#9C8676" }}>MARGEN</div><div style={{ fontWeight: 800, color: "#D69B7A", fontSize: 15 }}>{(r.margen * 100).toFixed(0)}%</div></div>
              </div>
              {open && (
                <div style={{ marginTop: 12, borderTop: "1px solid #EADFD3", paddingTop: 10 }}>
                  {r.ingredientes.map((ing, idx) => {
                    const mat = materiales.find(m => m.id === ing.matId);
                    if (!mat) return null;
                    const ppu  = precioPromedio(mat.compras);
                    const conv = ing.cantidadOriginal && ing.unidadOriginal && ing.unidadOriginal !== mat.unidad;
                    return (
                      <div key={ing._key || idx} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "3px 0", color: "#8A7A6D", borderBottom: "1px solid #EADFD3" }}>
                        <span>{mat.nombre} {conv ? `(${ing.cantidadOriginal} ${ing.unidadOriginal})` : ""}</span>
                        <span>{ing.cantidad.toFixed(4)} {mat.unidad} = <span style={{ color: "#D69B7A" }}>${f2(ing.cantidad * ppu)}</span></span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Confirmación de eliminación */}
      {confirmDelete && (
        <ConfirmModal
          icon="📋"
          title={`¿Eliminar "${confirmDelete.nombre}"?`}
          message="Los pedidos que ya usan esta receta no se verán afectados, pero no podrás crear nuevos pedidos con ella. Esta acción no se puede deshacer."
          confirmLabel="Eliminar"
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => { eliminar(confirmDelete.id); setConfirmDelete(null); }}
        />
      )}
    </div>
  );
}

// ─── MÓDULO: Pedidos ──────────────────────────────────────────────────────────
function PedidosModule({ pedidos, setPedidos, recetas, materiales, setMateriales, fondo, setFondo, toast }) {
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId]     = useState(null);
  const [filtro, setFiltro]     = useState("todos");
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [fechaDesde, setFechaDesde] = useState("");
  const [fechaHasta, setFechaHasta] = useState("");
  const [errores, setErrores]   = useState({});
  const [pedidoNuevo, setPedidoNuevo] = useState(null);

  const blank = () => ({
    cliente: "", telefono: "", recetaId: recetas[0] && recetas[0].id || "", cantidad: 1,
    fechaEncargo: hoy(), fechaEntrega: "", estado: "pendiente", nota: "",
    extrasIds: [], foto: null, usarPrecioManual: false, precioManual: "",
    esPersonal: false, pctFondo: fondo.porcentajeGlobal,
  });
  const [form, setForm] = useState(blank());

  const recetaSel   = recetas.find(x => x.id === form.recetaId);
  const costoBase   = recetaSel ? costoReceta(recetaSel, materiales) * (+form.cantidad || 1) : 0;
  const extrasTotal = form.extrasIds.reduce((s, id) => { const m = materiales.find(x => x.id === id); return s + (m ? (m.precioAgregado || 0) : 0); }, 0);
  const precioSug   = recetaSel ? costoBase * (1 + recetaSel.margen) + extrasTotal : 0;
  const precioVenta = form.usarPrecioManual ? (+form.precioManual || 0) : precioSug;
  const gananciaF   = precioVenta - costoBase - extrasTotal;
  const alFondoF    = form.esPersonal ? 0 : costoBase + extrasTotal + (gananciaF * (+form.pctFondo || 0) / 100);

  const toggleExtra = (id) => setForm(f => ({ ...f, extrasIds: f.extrasIds.includes(id) ? f.extrasIds.filter(x => x !== id) : [...f.extrasIds, id] }));

  const abrirEditar = (p) => {
    setForm({ cliente: p.cliente, telefono: p.telefono || "", recetaId: p.recetaId, cantidad: p.cantidad, fechaEncargo: p.fechaEncargo, fechaEntrega: p.fechaEntrega, estado: p.estado, nota: p.nota || "", extrasIds: p.extrasIds || [], foto: p.foto || null, usarPrecioManual: p.usarPrecioManual || false, precioManual: p.precioManual || "", esPersonal: p.esPersonal || false, pctFondo: p.pctFondo != null ? p.pctFondo : fondo.porcentajeGlobal });
    setEditId(p.id); setShowForm(true); setErrores({});
  };

  const guardar = () => {
    const errs = {};
    if (!form.cliente.trim()) errs.cliente = "Ingresa el nombre del cliente.";
    if (!form.recetaId)       errs.recetaId = "Selecciona una receta.";
    if (!form.fechaEntrega)   errs.fechaEntrega = "Elige la fecha de entrega.";
    if (Object.keys(errs).length) { setErrores(errs); return; }
    setErrores({});
    const datos = { ...form, cantidad: +form.cantidad, precioManual: form.usarPrecioManual ? +form.precioManual : null };
    if (editId) {
      setPedidos(p => p.map(x => x.id === editId ? { ...x, ...datos } : x));
      toast("✅ Pedido actualizado");
    } else {
      const nuevoId = uid();
      const nuevoPedido = { ...datos, id: nuevoId };
      setPedidos(p => [...p, nuevoPedido]);
      toast("🎂 Pedido agregado");
      setPedidoNuevo(nuevoPedido);
    }
    setForm(blank()); setShowForm(false); setEditId(null);
  };

  const calcPedido = (p) => {
    const r       = recetas.find(x => x.id === p.recetaId);
    const costo   = r ? costoReceta(r, materiales) * p.cantidad : 0;
    const extras  = (p.extrasIds || []).reduce((s, id) => { const m = materiales.find(x => x.id === id); return s + (m ? (m.precioAgregado || 0) : 0); }, 0);
    const precio  = p.usarPrecioManual ? (+p.precioManual || 0) : (r ? costo * (1 + r.margen) + extras : 0);
    const pct     = p.pctFondo != null ? p.pctFondo : fondo.porcentajeGlobal;
    const ganancia = precio - costo - extras;
    // Al fondo regresa el costo de material + el % de la ganancia que definas
    // (el resto de la ganancia queda fuera del fondo, disponible para ti).
    const alFondo  = p.esPersonal ? 0 : costo + extras + (ganancia * pct / 100);
    return { costo, extras, precio, ganancia, alFondo };
  };

  const descontarStock = (pedido, revertir) => {
    const r = recetas.find(x => x.id === pedido.recetaId);
    setMateriales(prev => prev.map(mat => {
      const totalIng = ((r && r.ingredientes) || []).filter(i => i.matId === mat.id).reduce((s, i) => s + i.cantidad, 0);
      const esExtra  = (pedido.extrasIds || []).includes(mat.id) ? 1 : 0;
      const descuento = totalIng * pedido.cantidad + esExtra;
      if (!descuento) return mat;
      if (revertir) {
        const desc = [...(mat.descuentos || [])];
        let idx = -1;
        for (let i = desc.length - 1; i >= 0; i--) { if (desc[i].pedidoId === pedido.id) { idx = i; break; } }
        if (idx >= 0) desc.splice(idx, 1);
        return { ...mat, descuentos: desc };
      }
      return { ...mat, descuentos: [...(mat.descuentos || []), { id: uid(), pedidoId: pedido.id, cantidad: descuento, fecha: hoy() }] };
    }));
  };

  const cambiarEstado = (id, nuevo) => {
    const p = pedidos.find(x => x.id === id);
    if (!p) return;
    if (nuevo === "entregado" && p.estado !== "entregado") {
      descontarStock(p, false);
      const calc = calcPedido(p);
      const rec  = recetas.find(x => x.id === p.recetaId);
      setFondo(f => ({ ...f, movimientos: [...f.movimientos, { id: uid(), tipo: "venta", monto: calc.alFondo, descripcion: `Venta: ${p.cliente} — ${(rec && rec.nombre) || ""} (costo + ${p.pctFondo != null ? p.pctFondo : fondo.porcentajeGlobal}% ganancia)`, fecha: hoy(), ref: id }] }));
      toast("📦 Entregado · Venta registrada en fondo");
    }
    if (p.estado === "entregado" && nuevo !== "entregado") {
      descontarStock(p, true);
      setFondo(f => ({ ...f, movimientos: f.movimientos.filter(m => !(m.ref === id && m.tipo === "venta")) }));
      toast("↩ Estado revertido");
    }
    setPedidos(prev => prev.map(x => x.id === id ? { ...x, estado: nuevo } : x));
  };

  const eliminar = (id) => {
    const p = pedidos.find(x => x.id === id);
    if (p && p.estado === "entregado") {
      descontarStock(p, true);
      setFondo(f => ({ ...f, movimientos: f.movimientos.filter(m => m.ref !== id) }));
    }
    setPedidos(prev => prev.filter(x => x.id !== id));
    toast("🗑 Pedido eliminado");
  };

  // ── Compartir resumen de un pedido individual por WhatsApp ──
  const compartirPedido = (p) => {
    const r    = recetas.find(x => x.id === p.recetaId);
    const calc = calcPedido(p);

    let msg = `🍰 *Resumen de tu pedido*\n\n`;
    msg += `📋 Encargo: ${(r && r.nombre) || "—"}\n`;
    msg += `📅 Fecha de entrega: ${p.fechaEntrega}\n`;
    if (!p.esPersonal) msg += `💰 Precio: $${f2(calc.precio)}\n`;

    // Limpia el número y, si no trae código de país, asume Cuba (+53) por defecto.
    // Los móviles cubanos tienen 8 dígitos; con el código de país (53) quedan 10.
    let tel = (p.telefono || "").replace(/\D/g, "");
    if (tel && tel.length <= 8) tel = "53" + tel;

    abrirWhatsApp(tel, msg);
    toast(tel ? "📤 Abriendo chat de WhatsApp…" : "📤 Abriendo WhatsApp…");
  };

  const lista = (filtro === "todos" ? pedidos : pedidos.filter(p => p.estado === filtro))
    .filter(p => !fechaDesde || p.fechaEntrega >= fechaDesde)
    .filter(p => !fechaHasta || p.fechaEntrega <= fechaHasta)
    .slice().sort((a, b) => new Date(a.fechaEntrega) - new Date(b.fechaEntrega));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h2 style={{ margin: 0, fontSize: 21, color: "#3D2B24", fontFamily: "'Fraunces',serif", fontWeight: 600 }}>Pedidos</h2>
        <Btn onClick={() => { setForm(blank()); setEditId(null); setShowForm(s => !s); setErrores({}); }}>+ Nuevo pedido</Btn>
      </div>

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        {["todos", ...Object.keys(ESTADOS)].map(f => {
          const cnt = f === "todos" ? pedidos.length : pedidos.filter(p => p.estado === f).length;
          return <button key={f} onClick={() => setFiltro(f)} style={{ background: filtro === f ? "#B5542F" : "#FFFFFF", border: `1px solid ${filtro === f ? "#B5542F" : "#EADFD3"}`, color: filtro === f ? "#FFFFFF" : "#9C8676", borderRadius: 20, padding: "5px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>{f === "todos" ? "Todos" : ESTADOS[f].label} <span style={{ opacity: .7 }}>{cnt}</span></button>;
        })}
      </div>

      {/* Filtro por rango de fecha de entrega */}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
        <div style={{ flex: 1, minWidth: 130 }}>
          <Inp label="Entrega desde" type="date" value={fechaDesde} onChange={e => setFechaDesde(e.target.value)} />
        </div>
        <div style={{ flex: 1, minWidth: 130 }}>
          <Inp label="Entrega hasta" type="date" value={fechaHasta} onChange={e => setFechaHasta(e.target.value)} />
        </div>
        {(fechaDesde || fechaHasta) && (
          <button onClick={() => { setFechaDesde(""); setFechaHasta(""); }} style={{ background: "#FFFFFF", border: "1px solid #EADFD3", borderRadius: 9, padding: "8px 13px", color: "#9C8676", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", height: 38 }}>
            ✕ Limpiar
          </button>
        )}
      </div>

      {showForm && (
        <Modal title={editId ? "Editar pedido" : "Nuevo pedido"} onClose={() => { setShowForm(false); setEditId(null); setForm(blank()); setErrores({}); }} wide>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Inp label="Cliente" value={form.cliente} onChange={e => { setForm({ ...form, cliente: e.target.value }); if (errores.cliente) setErrores(er => ({ ...er, cliente: null })); }} placeholder="Nombre completo" error={errores.cliente} />
              <Inp label="Teléfono" value={form.telefono} onChange={e => setForm({ ...form, telefono: e.target.value })} placeholder="5XXXXXXX (sin +53, se agrega solo)" />
              <Slct label="Receta / Producto" value={form.recetaId} onChange={e => { setForm({ ...form, recetaId: e.target.value, extrasIds: [] }); if (errores.recetaId) setErrores(er => ({ ...er, recetaId: null })); }} error={errores.recetaId}>
                {recetas.length === 0 && <option value="">— Sin recetas —</option>}
                {recetas.map(r => <option key={r.id} value={r.id}>{r.nombre}</option>)}
              </Slct>
              <Inp label="Cantidad" type="number" min={1} value={form.cantidad} onChange={e => setForm({ ...form, cantidad: e.target.value })} />
              <Inp label="Fecha encargo" type="date" value={form.fechaEncargo} onChange={e => setForm({ ...form, fechaEncargo: e.target.value })} />
              <Inp label="Fecha entrega" type="date" value={form.fechaEntrega} onChange={e => { setForm({ ...form, fechaEntrega: e.target.value }); if (errores.fechaEntrega) setErrores(er => ({ ...er, fechaEntrega: null })); }} error={errores.fechaEntrega} />
              <div style={{ gridColumn: "1/-1" }}><Inp label="Nota" value={form.nota} onChange={e => setForm({ ...form, nota: e.target.value })} placeholder="Diseño, alergias, color…" /></div>
              <div style={{ gridColumn: "1/-1" }}>
                <label style={S.lbl}>Foto de referencia (opcional)</label>
                {form.foto ? (
                  <div style={{ position: "relative" }}>
                    <img src={form.foto} alt="" style={{ width: "100%", maxHeight: 200, objectFit: "cover", borderRadius: 10, border: "1px solid #EADFD3", display: "block" }} />
                    <button onClick={() => setForm(p => ({ ...p, foto: null }))} style={{ position: "absolute", top: 6, right: 6, background: "#FBEAEA", border: "none", color: "#C94F4F", borderRadius: 6, padding: "3px 9px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>✕</button>
                  </div>
                ) : (
                  <label style={{ ...S.inp, cursor: "pointer", padding: "8px 14px", fontSize: 13, fontWeight: 600, color: "#D69B7A", display: "inline-flex", alignItems: "center", gap: 6 }}>
                    🖼 Seleccionar desde galería
                    <input type="file" accept="image/*" style={{ display: "none" }} onChange={e => {
                      const file = e.target.files[0];
                      if (!file) return;
                      const reader = new FileReader();
                      reader.onload = ev => {
                        const img = new Image();
                        img.onload = () => {
                          const MAX = 800, canvas = document.createElement("canvas");
                          const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
                          canvas.width = Math.round(img.width * ratio);
                          canvas.height = Math.round(img.height * ratio);
                          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                          setForm(p => ({ ...p, foto: canvas.toDataURL("image/jpeg", 0.8) }));
                        };
                        img.src = ev.target.result;
                      };
                      reader.readAsDataURL(file);
                    }} />
                  </label>
                )}
              </div>
            </div>

            {/* Solo agregados marcados en inventario */}
            {materiales.filter(m => m.esAgregado).length > 0 && (
              <div style={{ borderTop: "1px solid #EADFD3", paddingTop: 12 }}>
                <label style={S.lbl}>Agregados</label>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 6 }}>
                  {materiales.filter(m => m.esAgregado).map(mat => {
                    const sel   = form.extrasIds.includes(mat.id);
                    const precio = mat.precioAgregado || 0;
                    return (
                      <button key={mat.id} onClick={() => toggleExtra(mat.id)} style={{ background: sel ? "#B5542F33" : "#FBF3EC", border: `1.5px solid ${sel ? "#C97A54" : "#EADFD3"}`, color: sel ? "#3D2B24" : "#8A7A6D", borderRadius: 10, padding: "6px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
                        {sel ? "✓" : "+"} {mat.nombre} <span style={{ color: sel ? "#C97A54" : "#A69686" }}>+${f2(precio)}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {recetaSel && (
              <div style={{ borderTop: "1px solid #EADFD3", paddingTop: 12 }}>
                <label style={S.lbl}>Precio de venta</label>
                <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                  <button onClick={() => setForm(f => ({ ...f, usarPrecioManual: false }))} style={{ flex: 1, background: !form.usarPrecioManual ? "#B5542F33" : "#FBF3EC", border: `1.5px solid ${!form.usarPrecioManual ? "#C97A54" : "#EADFD3"}`, color: !form.usarPrecioManual ? "#3D2B24" : "#9C8676", borderRadius: 10, padding: "8px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>✦ Sugerido</button>
                  <button onClick={() => setForm(f => ({ ...f, usarPrecioManual: true }))} style={{ flex: 1, background: form.usarPrecioManual ? "#B5542F33" : "#FBF3EC", border: `1.5px solid ${form.usarPrecioManual ? "#C97A54" : "#EADFD3"}`, color: form.usarPrecioManual ? "#3D2B24" : "#9C8676", borderRadius: 10, padding: "8px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>✎ Manual</button>
                </div>
                {form.usarPrecioManual && <Inp label="Precio de venta $" type="number" value={form.precioManual} onChange={e => setForm(f => ({ ...f, precioManual: e.target.value }))} placeholder="0.00" />}
                <div style={{ background: "#FBF3EC", borderRadius: 10, padding: "12px 14px", marginTop: 10, display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
                  {[["COSTO", `$${f2(costoBase)}`, "#C94F4F"], ["EXTRAS", `$${f2(extrasTotal)}`, "#D99A34"], ["VENTA", `$${f2(precioVenta)}`, "#6B8E63"], ["GANANCIA", `$${f2(gananciaF)}`, gananciaF >= 0 ? "#C97A54" : "#C94F4F"]].map(([lbl, val, color]) => (
                    <div key={lbl}><div style={{ fontSize: 10, color: "#9C8676" }}>{lbl}</div><div style={{ fontWeight: 800, color, fontSize: 14 }}>{val}</div></div>
                  ))}
                </div>
              </div>
            )}
