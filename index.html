            {!form.esPersonal && (
              <div style={{ borderTop: "1px solid #EADFD3", paddingTop: 12 }}>
                <label style={S.lbl}>% de ganancia que va al fondo</label>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <input type="range" min={0} max={100} step={5} value={form.pctFondo} onChange={e => setForm(f => ({ ...f, pctFondo: +e.target.value }))} style={{ flex: 1, accentColor: "#C97A54" }} />
                  <span style={{ fontWeight: 800, color: "#C97A54", fontSize: 16, minWidth: 44 }}>{form.pctFondo}%</span>
                </div>
                {recetaSel && <div style={{ fontSize: 12, color: "#8A7A6D", marginTop: 6 }}>Al entregar irán al fondo: <b style={{ color: "#5B8A9E" }}>${f2(alFondoF)}</b></div>}
              </div>
            )}

            <button onClick={() => setForm(f => ({ ...f, esPersonal: !f.esPersonal }))} style={{ display: "flex", alignItems: "center", gap: 10, background: form.esPersonal ? "#FBF0DC" : "#FBF3EC", border: `1.5px solid ${form.esPersonal ? "#C6822A" : "#EADFD3"}`, color: form.esPersonal ? "#D99A34" : "#9C8676", borderRadius: 10, padding: "10px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", width: "100%", textAlign: "left" }}>
              <span style={{ fontSize: 18 }}>{form.esPersonal ? "☑" : "☐"}</span>
              <span>Es encargo personal — solo registrar gasto de materiales</span>
            </button>

            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={guardar}>{editId ? "Actualizar pedido" : "Guardar pedido"}</Btn>
              <Btn v="ghost" onClick={() => { setShowForm(false); setEditId(null); setForm(blank()); setErrores({}); }}>Cancelar</Btn>
            </div>
          </div>
        </Modal>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {lista.length === 0 && pedidos.length === 0 && (
          <EstadoVacio
            icon="🎂"
            title="Aún no tienes pedidos"
            subtitle="Registra el primer pedido de un cliente: elige una receta, cantidad y fecha de entrega, y calcularemos el costo y la ganancia automáticamente."
            actionLabel="+ Crear primer pedido"
            onAction={() => setShowForm(true)}
          />
        )}
        {lista.length === 0 && pedidos.length > 0 && (
          <div style={{ textAlign: "center", color: "#9C8676", padding: "32px 0", fontSize: 13 }}>
            No hay pedidos en "{filtro === "todos" ? "Todos" : ESTADOS[filtro].label}"{(fechaDesde || fechaHasta) ? " para el rango de fechas elegido" : ""}.
          </div>
        )}
        {lista.map(p => {
          const r    = recetas.find(x => x.id === p.recetaId);
          const calc = calcPedido(p);
          const dias = Math.ceil((new Date(p.fechaEntrega) - new Date()) / 86400000);
          const urgente = dias <= 1 && p.estado !== "entregado";
          const extrasList = (p.extrasIds || []).map(id => materiales.find(x => x.id === id)).filter(Boolean);
          return (
            <div key={p.id} style={{ ...S.card, borderColor: p.esPersonal ? "#C6822A44" : urgente ? "#C6822A55" : "#EADFD3" }}>
              {p.foto && <FotoThumb foto={p.foto} alt={p.cliente} />}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
                <div>
                  {p.esPersonal && <span style={{ fontSize: 10, background: "#C6822A22", color: "#D99A34", border: "1px solid #C6822A44", borderRadius: 10, padding: "1px 8px", marginRight: 6 }}>Personal</span>}
                  <span style={{ fontWeight: 700, fontSize: 15, color: "#3D2B24" }}>{p.cliente} {urgente && <span style={{ fontSize: 11, color: "#C6822A" }}>🔥</span>}</span>
                  {p.telefono && <div style={{ fontSize: 12, color: "#9C8676" }}>📞 {p.telefono}</div>}
                </div>
                <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                  <Badge estado={p.estado} />
                  <Btn sm v="ghost" onClick={() => compartirPedido(p)} title="Compartir por WhatsApp">📤</Btn>
                  <Btn sm v="ghost" onClick={() => abrirEditar(p)}>✏️</Btn>
                  <Btn sm v="danger" onClick={() => setConfirmDelete(p)}>🗑</Btn>
                </div>
              </div>
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 8 }}>
                <span style={{ fontSize: 13 }}><span style={{ color: "#9C8676" }}>Producto: </span><span style={{ color: "#D69B7A", fontWeight: 600 }}>{(r && r.nombre) || "—"} × {p.cantidad}</span></span>
                <span style={{ fontSize: 13 }}><span style={{ color: "#9C8676" }}>Entrega: </span><span style={{ color: "#D99A34", fontWeight: 600 }}>{p.fechaEntrega}</span></span>
              </div>
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 8, background: "#FBF3EC", borderRadius: 9, padding: "8px 12px" }}>
                <span style={{ fontSize: 12 }}><span style={{ color: "#9C8676" }}>Costo: </span><span style={{ color: "#C94F4F", fontWeight: 700 }}>${f2(calc.costo)}</span></span>
                {!p.esPersonal && <span style={{ fontSize: 12 }}><span style={{ color: "#9C8676" }}>Venta: </span><span style={{ color: "#6B8E63", fontWeight: 700 }}>${f2(calc.precio)}</span>{p.usarPrecioManual && <span style={{ fontSize: 10, color: "#D99A34", marginLeft: 4 }}>manual</span>}</span>}
                <span style={{ fontSize: 12 }}><span style={{ color: "#9C8676" }}>{p.esPersonal ? "Gasto: " : "Ganancia: "}</span><span style={{ color: p.esPersonal ? "#C94F4F" : calc.ganancia >= 0 ? "#C97A54" : "#C94F4F", fontWeight: 700 }}>{p.esPersonal ? `-$${f2(calc.costo)}` : `$${f2(calc.ganancia)}`}</span></span>
                {!p.esPersonal && <span style={{ fontSize: 12 }}><span style={{ color: "#9C8676" }}>Al fondo: </span><span style={{ color: "#5B8A9E", fontWeight: 700 }}>${f2(calc.alFondo)}</span><span style={{ fontSize: 10, color: "#A69686", marginLeft: 3 }}>({p.pctFondo != null ? p.pctFondo : fondo.porcentajeGlobal}%)</span></span>}
              </div>
              {extrasList.length > 0 && <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 5 }}>{extrasList.map(m => <span key={m.id} style={{ background: "#EADFD3", color: "#D69B7A", borderRadius: 20, padding: "2px 10px", fontSize: 11, fontWeight: 600 }}>{m.nombre}</span>)}</div>}
              {p.nota && <div style={{ marginTop: 8, fontSize: 12, color: "#8A7A6D", background: "#FBF3EC", borderRadius: 7, padding: "5px 10px" }}>💬 {p.nota}</div>}
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10, alignItems: "center" }}>
                <div style={{ display: "flex", gap: 5, flexWrap: "wrap", flex: 1 }}>
                  {Object.entries(ESTADOS).map(([k, { label, color }]) => (
                    <button key={k} onClick={() => cambiarEstado(p.id, k)} style={{ background: p.estado === k ? color + "33" : "transparent", border: `1px solid ${p.estado === k ? color : "#EADFD3"}`, color: p.estado === k ? color : "#A69686", borderRadius: 7, padding: "4px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>{label}</button>
                  ))}
                </div>
                {/* Avance rápido al siguiente estado de la secuencia */}
                {(() => {
                  const ORDEN = ["pendiente", "en_proceso", "listo", "entregado"];
                  const idx   = ORDEN.indexOf(p.estado);
                  const sig   = idx >= 0 && idx < ORDEN.length - 1 ? ORDEN[idx + 1] : null;
                  if (!sig) return null;
                  const sigInfo = ESTADOS[sig];
                  return (
                    <button
                      onClick={() => cambiarEstado(p.id, sig)}
                      style={{ background: `linear-gradient(135deg, ${sigInfo.color}, ${sigInfo.color}cc)`, border: "none", color: "#FFFFFF", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 5, whiteSpace: "nowrap", flexShrink: 0 }}
                    >
                      <span>{sigInfo.label}</span>
                      <span>→</span>
                    </button>
                  );
                })()}
              </div>
            </div>
          );
        })}
      </div>

      {/* Confirmación de eliminación */}
      {confirmDelete && (
        <ConfirmModal
          icon="🎂"
          title={`¿Eliminar pedido de "${confirmDelete.cliente}"?`}
          message={confirmDelete.estado === "entregado"
            ? "Este pedido ya fue entregado: se revertirá el descuento de stock y se eliminará el movimiento de venta del fondo. Esta acción no se puede deshacer."
            : "Esta acción no se puede deshacer."}
          confirmLabel="Eliminar"
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => { eliminar(confirmDelete.id); setConfirmDelete(null); }}
        />
      )}

      {/* Prompt para enviar el resumen al cliente justo tras crear el pedido */}
      {pedidoNuevo && (
        <ConfirmModal
          icon="📤"
          danger={false}
          title="¿Enviar el resumen al cliente?"
          message={`Se abrirá WhatsApp con el encargo, fecha de entrega y precio listos para enviar a ${pedidoNuevo.cliente}.`}
          confirmLabel="Enviar por WhatsApp"
          cancelLabel="No, gracias"
          onCancel={() => setPedidoNuevo(null)}
          onConfirm={() => { compartirPedido(pedidoNuevo); setPedidoNuevo(null); }}
        />
      )}
    </div>
  );
}

// ─── MÓDULO: Fondo ────────────────────────────────────────────────────────────
function FondoModule({ fondo, setFondo, toast }) {
  const saldo = saldoFondo(fondo);
  const [editSaldo, setEditSaldo]   = useState(false);
  const [nuevoSaldo, setNuevoSaldo] = useState(fondo.saldoInicial);
  const [editPct, setEditPct]       = useState(false);
  const [showAjuste, setShowAjuste] = useState(false);
  const [ajuste, setAjuste]         = useState({ tipo: "ingreso", monto: "", descripcion: "" });

  const guardarSaldo = () => { setFondo(f => ({ ...f, saldoInicial: +nuevoSaldo })); setEditSaldo(false); toast("✅ Saldo inicial actualizado"); };

  const agregarAjuste = () => {
    if (!ajuste.monto || !ajuste.descripcion) return;
    const monto = ajuste.tipo === "ingreso" ? +ajuste.monto : -Math.abs(+ajuste.monto);
    setFondo(f => ({ ...f, movimientos: [...f.movimientos, { id: uid(), tipo: ajuste.tipo, monto, descripcion: ajuste.descripcion, fecha: hoy() }] }));
    setAjuste({ tipo: "ingreso", monto: "", descripcion: "" }); setShowAjuste(false);
    toast(ajuste.tipo === "ingreso" ? "💵 Ingreso registrado" : "💸 Egreso registrado");
  };

  const totalEntradas = fondo.movimientos.filter(m => m.monto > 0).reduce((s, m) => s + m.monto, 0);
  const totalSalidas  = fondo.movimientos.filter(m => m.monto < 0).reduce((s, m) => s + m.monto, 0);
  const movVis = [...fondo.movimientos].reverse().slice(0, 40);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <h2 style={{ margin: 0, fontSize: 21, color: "#3D2B24", fontFamily: "'Fraunces',serif", fontWeight: 600 }}>Fondo / Caja</h2>

      <div style={{ ...S.card, borderColor: "#5B8A9E55" }}>
        <div style={{ fontSize: 12, color: "#9C8676", fontWeight: 700, letterSpacing: 0.5 }}>SALDO DISPONIBLE</div>
        <div style={{ fontSize: 42, fontWeight: 900, color: saldo >= 0 ? "#5B8A9E" : "#C94F4F", marginTop: 4 }}>${f2(saldo)}</div>
        <div style={{ display: "flex", gap: 20, marginTop: 10, flexWrap: "wrap" }}>
          <div><div style={{ fontSize: 11, color: "#9C8676" }}>Saldo inicial</div><div style={{ fontWeight: 700, color: "#8A7A6D" }}>${f2(fondo.saldoInicial)}</div></div>
          <div><div style={{ fontSize: 11, color: "#9C8676" }}>Entradas</div><div style={{ fontWeight: 700, color: "#6B8E63" }}>+${f2(totalEntradas)}</div></div>
          <div><div style={{ fontSize: 11, color: "#9C8676" }}>Salidas</div><div style={{ fontWeight: 700, color: "#C94F4F" }}>${f2(totalSalidas)}</div></div>
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 16, flexWrap: "wrap" }}>
          <Btn sm v="ghost" onClick={() => { setNuevoSaldo(fondo.saldoInicial); setEditSaldo(true); }}>✏️ Saldo inicial</Btn>
          <Btn sm v="ghost" onClick={() => setShowAjuste(s => !s)}>+ Ajuste manual</Btn>
          <Btn sm v="ghost" onClick={() => setEditPct(s => !s)}>⚙️ % global</Btn>
        </div>
      </div>

      {editSaldo && (
        <div style={{ ...S.card, borderColor: "#B5542F55" }}>
          <div style={{ fontWeight: 700, color: "#3D2B24", marginBottom: 12 }}>Saldo inicial del fondo</div>
          <Inp label="Monto $" type="number" value={nuevoSaldo} onChange={e => setNuevoSaldo(e.target.value)} placeholder="0.00" />
          <div style={{ fontSize: 12, color: "#8A7A6D", marginTop: 6 }}>El dinero con el que comienzas a usar la app.</div>
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}><Btn onClick={guardarSaldo}>Guardar</Btn><Btn v="ghost" onClick={() => setEditSaldo(false)}>Cancelar</Btn></div>
        </div>
      )}

      {editPct && (
        <div style={{ ...S.card, borderColor: "#B5542F55" }}>
          <div style={{ fontWeight: 700, color: "#3D2B24", marginBottom: 8 }}>% de ganancia al fondo por defecto</div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <input type="range" min={0} max={100} step={5} value={fondo.porcentajeGlobal} onChange={e => setFondo(f => ({ ...f, porcentajeGlobal: +e.target.value }))} style={{ flex: 1, accentColor: "#C97A54" }} />
            <span style={{ fontWeight: 800, color: "#C97A54", fontSize: 20, minWidth: 50 }}>{fondo.porcentajeGlobal}%</span>
          </div>
          <div style={{ fontSize: 12, color: "#8A7A6D", marginTop: 6 }}>Se puede cambiar en cada pedido individualmente.</div>
          <div style={{ marginTop: 12 }}><Btn sm v="ghost" onClick={() => setEditPct(false)}>Listo</Btn></div>
        </div>
      )}

      {showAjuste && (
        <div style={{ ...S.card, borderColor: "#B5542F55" }}>
          <div style={{ fontWeight: 700, color: "#3D2B24", marginBottom: 12 }}>Ajuste manual</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Slct label="Tipo" value={ajuste.tipo} onChange={e => setAjuste({ ...ajuste, tipo: e.target.value })}>
              <option value="ingreso">💵 Ingreso</option>
              <option value="egreso">💸 Egreso</option>
            </Slct>
            <Inp label="Monto $" type="number" value={ajuste.monto} onChange={e => setAjuste({ ...ajuste, monto: e.target.value })} placeholder="0.00" />
            <div style={{ gridColumn: "1/-1" }}><Inp label="Descripción" value={ajuste.descripcion} onChange={e => setAjuste({ ...ajuste, descripcion: e.target.value })} placeholder="Ej: Pago recibido, gasto extra…" /></div>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}><Btn onClick={agregarAjuste}>Registrar</Btn><Btn v="ghost" onClick={() => setShowAjuste(false)}>Cancelar</Btn></div>
        </div>
      )}

      <div>
        <div style={{ fontSize: 12, color: "#9C8676", fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 10 }}>Movimientos ({fondo.movimientos.length})</div>
        {movVis.length === 0 && (
          <EstadoVacio
            icon="🏦"
            title="Sin movimientos aún"
            subtitle="Aquí verás cada venta, compra de materiales y ajuste manual que afecte tu fondo disponible."
            actionLabel="+ Registrar ajuste manual"
            onAction={() => setShowAjuste(true)}
          />
        )}
        {movVis.map(m => {
          const icono = m.tipo === "venta" ? "💰" : m.tipo === "compra" ? "📦" : m.monto > 0 ? "💵" : "💸";
          return (
            <div key={m.id} style={{ ...S.card, marginBottom: 8, padding: "11px 16px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                <div>
                  <span style={{ fontSize: 15, marginRight: 8 }}>{icono}</span>
                  <span style={{ fontSize: 14, color: "#3D2B24", fontWeight: 600 }}>{m.descripcion}</span>
                  <div style={{ fontSize: 11, color: "#A69686", marginTop: 2 }}>{m.fecha}</div>
                </div>
                <div style={{ fontWeight: 800, fontSize: 16, color: m.monto >= 0 ? "#6B8E63" : "#C94F4F" }}>{m.monto >= 0 ? "+" : ""}{f2(m.monto)}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── MÓDULO: Dashboard ────────────────────────────────────────────────────────
function Dashboard({ materiales, recetas, pedidos, fondo, setTab }) {

  const calcP = (p) => {
    const r      = recetas.find(x => x.id === p.recetaId);
    const costo  = r ? costoReceta(r, materiales) * p.cantidad : 0;
    const extras = (p.extrasIds || []).reduce((s, id) => { const m = materiales.find(x => x.id === id); return s + (m ? (m.precioAgregado || 0) : 0); }, 0);
    const precio = p.usarPrecioManual ? (+p.precioManual || 0) : (r ? costo * (1 + r.margen) + extras : 0);
    return { costo, precio, ganancia: precio - costo - extras };
  };

  // Fecha actual para filtros del mes
  const ahora       = new Date();
  const mesActual   = ahora.getMonth();
  const anioActual  = ahora.getFullYear();
  const esMes = (fecha) => {
    const d = new Date(fecha);
    return d.getMonth() === mesActual && d.getFullYear() === anioActual;
  };

  const activos          = pedidos.filter(p => p.estado !== "entregado");
  const pendientes       = pedidos.filter(p => p.estado === "pendiente" || p.estado === "en_proceso");
  const entregadosMes    = pedidos.filter(p => p.estado === "entregado" && esMes(p.fechaEntrega || p.fechaEncargo));
  const ventasMes        = entregadosMes.filter(p => !p.esPersonal).reduce((s, p) => s + calcP(p).precio, 0);
  const gananciasMes     = entregadosMes.filter(p => !p.esPersonal).reduce((s, p) => s + calcP(p).ganancia, 0);
  const ingresosPend     = activos.filter(p => !p.esPersonal).reduce((s, p) => s + calcP(p).precio, 0);
  const bajosMin         = materiales.filter(m => bajoDeMinimoMat(m));
  const bajo             = materiales.filter(m => stockMaterial(m) < 1 && m.compras.length > 0);
  const entregasHoy      = activos.filter(p => p.fechaEntrega === hoy()).length;
  const saldo            = saldoFondo(fondo);
  const ultMovimientos   = [...fondo.movimientos].reverse().slice(0, 5);

  // Nombre del mes actual
  const nombreMes = ahora.toLocaleDateString("es", { month: "long" });

  const SecTitle = ({ children }) => (
    <div style={{ fontSize: 11, color: "#9C8676", fontWeight: 700, letterSpacing: 0.8, textTransform: "uppercase", marginBottom: 12, display: "flex", alignItems: "center", gap: 8 }}>
      <div style={{ flex: 1, height: 1, background: "#EADFD3" }} />
      {children}
      <div style={{ flex: 1, height: 1, background: "#EADFD3" }} />
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>

      {/* ── Saludo ── */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
        <div>
          <div style={{ fontSize: 24, fontWeight: 600, fontFamily: "'Fraunces',serif", color: "#3D2B24" }}>
            {ahora.getHours() < 12 ? "Buenos días 👋" : ahora.getHours() < 19 ? "Buenas tardes 👋" : "Buenas noches 👋"}
          </div>
          <div style={{ fontSize: 13, color: "#9C8676", marginTop: 3 }}>
            {ahora.toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" })}
          </div>
        </div>
        {entregasHoy > 0 && (
          <div style={{ background: "#C6822A22", border: "1px solid #C6822A55", borderRadius: 20, padding: "5px 14px", fontSize: 13, color: "#D99A34", fontWeight: 700 }}>
            🔥 {entregasHoy} entrega{entregasHoy > 1 ? "s" : ""} hoy
          </div>
        )}
      </div>

      {/* ── KPIs principales ── */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10 }}>

        {/* Fondo */}
        <div style={{ ...S.card, gridColumn: "1 / -1", background: "linear-gradient(135deg, #F5EAE0 0%, #EADFD3 100%)", borderColor: "#B5542F44", padding: "20px 22px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 11, color: "#C97A54", fontWeight: 700, letterSpacing: 0.8 }}>FONDO DISPONIBLE</div>
              <div style={{ fontSize: 36, fontWeight: 900, color: saldo >= 0 ? "#3D2B24" : "#C94F4F", marginTop: 4, lineHeight: 1 }}>${f2(saldo)}</div>
              <div style={{ fontSize: 12, color: "#9C8676", marginTop: 6 }}>
                Ventas este mes: <span style={{ color: "#6B8E63", fontWeight: 700 }}>${f2(ventasMes)}</span>
              </div>
            </div>
            <div style={{ fontSize: 40, opacity: 0.6 }}>🏦</div>
          </div>
        </div>

        {/* Pedidos pendientes */}
        <div style={{ ...S.card, borderColor: "#6B7BA633" }}>
          <div style={{ fontSize: 11, color: "#7C8BA6", fontWeight: 700, letterSpacing: 0.6 }}>PENDIENTES</div>
          <div style={{ fontSize: 32, fontWeight: 900, color: "#C97A54", marginTop: 4 }}>{pendientes.length}</div>
          <div style={{ fontSize: 12, color: "#9C8676", marginTop: 4 }}>
            {activos.length} activo{activos.length !== 1 ? "s" : ""}
          </div>
        </div>

        {/* Entregados este mes */}
        <div style={{ ...S.card, borderColor: "#6B8E6333" }}>
          <div style={{ fontSize: 11, color: "#6B8E63", fontWeight: 700, letterSpacing: 0.6 }}>ENTREGADOS</div>
          <div style={{ fontSize: 32, fontWeight: 900, color: "#6B8E63", marginTop: 4 }}>{entregadosMes.length}</div>
          <div style={{ fontSize: 12, color: "#9C8676", marginTop: 4 }}>en {nombreMes}</div>
        </div>

        {/* Ventas del mes */}
        <div style={{ ...S.card, borderColor: "#6B8E6333" }}>
          <div style={{ fontSize: 11, color: "#6B8E63", fontWeight: 700, letterSpacing: 0.6 }}>VENTAS {nombreMes.toUpperCase()}</div>
          <div style={{ fontSize: 28, fontWeight: 900, color: "#6B8E63", marginTop: 4 }}>${f2(ventasMes)}</div>
          <div style={{ fontSize: 12, color: "#9C8676", marginTop: 4 }}>
            Ganancia: <span style={{ color: "#C97A54", fontWeight: 700 }}>${f2(gananciasMes)}</span>
          </div>
        </div>

        {/* Por cobrar */}
        <div style={{ ...S.card, borderColor: "#D99A3433" }}>
          <div style={{ fontSize: 11, color: "#D99A34", fontWeight: 700, letterSpacing: 0.6 }}>POR COBRAR</div>
          <div style={{ fontSize: 28, fontWeight: 900, color: "#D99A34", marginTop: 4 }}>${f2(ingresosPend)}</div>
          <div style={{ fontSize: 12, color: "#9C8676", marginTop: 4 }}>en pedidos activos</div>
        </div>

      </div>

      {/* ── Accesos rápidos ── */}
      <div>
        <SecTitle>Accesos rápidos</SecTitle>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
          {[
            { icon: "🧂", label: "Inventario", tab: "materiales", color: "#5B8A9E", bg: "#EAF2F5" },
            { icon: "📋", label: "Recetas",    tab: "recetas",    color: "#B5542F", bg: "#F3DCC4" },
            { icon: "🎂", label: "Pedidos",    tab: "pedidos",    color: "#6B8E63", bg: "#EAF0E6" },
          ].map(a => (
            <button key={a.tab} onClick={() => setTab(a.tab)}
              style={{ background: a.bg, border: `1px solid ${a.color}33`, borderRadius: 14, padding: "16px 12px", cursor: "pointer", fontFamily: "inherit", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, transition: "transform .15s, border-color .15s" }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = a.color + "88"; e.currentTarget.style.transform = "translateY(-2px)"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = a.color + "33"; e.currentTarget.style.transform = "translateY(0)"; }}>
              <span style={{ fontSize: 28 }}>{a.icon}</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: a.color }}>{a.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* ── Próximas entregas ── */}
      {activos.length > 0 && (
        <div>
          <SecTitle>Próximas entregas</SecTitle>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {activos.slice().sort((a, b) => new Date(a.fechaEntrega) - new Date(b.fechaEntrega)).slice(0, 5).map(p => {
              const r    = recetas.find(x => x.id === p.recetaId);
              const calc = calcP(p);
              const dias = Math.ceil((new Date(p.fechaEntrega) - new Date()) / 86400000);
              const urgente = dias <= 1;
              return (
                <div key={p.id} style={{ ...S.card, padding: "12px 16px", borderColor: urgente ? "#C6822A55" : "#EADFD3" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                        {p.esPersonal && <span style={{ fontSize: 10, background: "#C6822A22", color: "#D99A34", border: "1px solid #C6822A44", borderRadius: 10, padding: "1px 7px" }}>Personal</span>}
                        <span style={{ fontWeight: 700, color: "#3D2B24", fontSize: 14 }}>{p.cliente}</span>
                      </div>
                      <div style={{ fontSize: 12, color: "#9C8676", marginTop: 2 }}>{r && r.nombre} × {p.cantidad}</div>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4, flexShrink: 0 }}>
                      <Badge estado={p.estado} />
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <span style={{ fontSize: 12, fontWeight: 700, color: p.esPersonal ? "#D99A34" : "#6B8E63" }}>
                          {p.esPersonal ? `-$${f2(calc.costo)}` : `$${f2(calc.precio)}`}
                        </span>
                        <span style={{ fontSize: 11, color: urgente ? "#C94F4F" : dias <= 3 ? "#D99A34" : "#A69686", fontWeight: urgente ? 700 : 400 }}>
                          {dias <= 0 ? "¡Hoy!" : dias === 1 ? "Mañana" : `${dias}d`}
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── Alertas Stock Mínimo ── */}
      {bajosMin.length > 0 && (
        <div>
          <SecTitle>⚠ Alertas de inventario</SecTitle>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {/* Contador resumen */}
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <div style={{ background: "#C94F4F18", border: "1px solid #C94F4F55", borderRadius: 12, padding: "8px 14px", display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 18 }}>🚨</span>
                <div>
                  <div style={{ fontSize: 18, fontWeight: 900, color: "#C94F4F", lineHeight: 1 }}>{bajosMin.length}</div>
                  <div style={{ fontSize: 10, color: "#8A7A6D" }}>bajo mínimo</div>
                </div>
              </div>
              <div style={{ background: "#D99A3418", border: "1px solid #D99A3455", borderRadius: 12, padding: "8px 14px", display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 18 }}>📦</span>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 900, color: "#D99A34", lineHeight: 1.2 }}>
                    ${f2(bajosMin.reduce((s, m) => s + faltanteMat(m) * precioPromedio(m.compras), 0))}
                  </div>
                  <div style={{ fontSize: 10, color: "#8A7A6D" }}>costo estimado a reponer</div>
                </div>
              </div>
            </div>

            {/* Tarjetas de alerta */}
            {bajosMin.map(m => {
              const stock    = stockMaterial(m);
              const min      = +(m.stockMinimo || 0);
              const faltante = faltanteMat(m);
              const pct      = pctStockMat(m);
              const pp       = precioPromedio(m.compras);
              const costFalt = pp > 0 ? faltante * pp : null;
              // color de barra según porcentaje
              const barColor = pct < 25 ? "#C94F4F" : pct < 60 ? "#D99A34" : "#6B8E63";

              return (
                <div key={m.id} style={{ ...S.card, borderColor: pct < 25 ? "#C94F4F55" : "#D99A3455", background: pct < 25 ? "#FBEAEA" : "#FBF0DC", padding: "14px 16px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                    {/* Nombre + tipo */}
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 14, fontWeight: 700, color: "#3D2B24" }}>{m.nombre}</span>
                        <span style={{ fontSize: 10, background: pct < 25 ? "#C94F4F22" : "#D99A3422", color: pct < 25 ? "#C94F4F" : "#D99A34", border: `1px solid ${pct < 25 ? "#C94F4F" : "#D99A34"}44`, borderRadius: 10, padding: "1px 7px", fontWeight: 700 }}>
                          {pct < 25 ? "⚠ CRÍTICO" : "⚠ BAJO"}
                        </span>
                      </div>
                      <div style={{ fontSize: 11, color: "#9C8676", marginTop: 2 }}>{m.tipo}</div>

                      {/* Barra de progreso */}
                      <div style={{ marginTop: 10, marginBottom: 4 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#8A7A6D", marginBottom: 4 }}>
                          <span>Stock actual</span>
                          <span style={{ color: barColor, fontWeight: 700 }}>{pct}% del mínimo</span>
                        </div>
                        <div style={{ height: 7, borderRadius: 4, background: "#EADFD3", overflow: "hidden" }}>
                          <div style={{ height: "100%", width: `${pct}%`, borderRadius: 4, background: `linear-gradient(90deg, ${barColor}88, ${barColor})`, transition: "width .4s" }} />
                        </div>
                      </div>

                      {/* Datos */}
                      <div style={{ display: "flex", gap: 16, marginTop: 8, flexWrap: "wrap" }}>
                        <div>
                          <div style={{ fontSize: 10, color: "#A69686" }}>Disponible</div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: barColor }}>{stock.toFixed(4)} {m.unidad}</div>
                        </div>
                        <div>
                          <div style={{ fontSize: 10, color: "#A69686" }}>Mínimo</div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: "#8A7A6D" }}>{min} {m.unidad}</div>
                        </div>
                        <div>
                          <div style={{ fontSize: 10, color: "#A69686" }}>Faltante</div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: "#D99A34" }}>{faltante.toFixed(4)} {m.unidad}</div>
                        </div>
                        {costFalt !== null && (
                          <div>
                            <div style={{ fontSize: 10, color: "#A69686" }}>Costo aprox.</div>
                            <div style={{ fontSize: 13, fontWeight: 700, color: "#D69B7A" }}>${f2(costFalt)}</div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}

            <button
              onClick={() => setTab("materiales")}
              style={{ background: "#C94F4F18", border: "1px solid #C94F4F33", borderRadius: 10, padding: "9px 14px", color: "#D97676", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", textAlign: "center" }}
            >
              📦 Ir a Inventario →
            </button>
          </div>
        </div>
      )}

      {/* ── Últimos movimientos ── */}
      {ultMovimientos.length > 0 && (
        <div>
          <SecTitle>Últimos movimientos</SecTitle>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {ultMovimientos.map(m => {
              const icono = m.tipo === "venta" ? "💰" : m.tipo === "compra" ? "📦" : m.monto > 0 ? "💵" : "💸";
              const color = m.monto >= 0 ? "#6B8E63" : "#C94F4F";
              return (
                <div key={m.id} style={{ ...S.card, padding: "10px 16px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
                      <div style={{ width: 34, height: 34, borderRadius: 10, background: m.monto >= 0 ? "#DCEAD5" : "#F5D6D6", border: `1px solid ${m.monto >= 0 ? "#B8D4AC" : "#E8B3B3"}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{icono}</div>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 13, color: "#3D2B24", fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.descripcion}</div>
                        <div style={{ fontSize: 11, color: "#B5A695", marginTop: 2 }}>{m.fecha}</div>
                      </div>
                    </div>
                    <div style={{ fontWeight: 800, fontSize: 15, color, flexShrink: 0 }}>{m.monto >= 0 ? "+" : ""}{f2(m.monto)}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Estado vacío total */}
      {pedidos.length === 0 && materiales.length === 0 && (
        <div style={{ ...S.card, textAlign: "center", padding: "48px 24px", borderStyle: "dashed" }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>🍰</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#3D2B24", marginBottom: 8 }}>¡Bienvenido a Mi Repostería!</div>
          <div style={{ fontSize: 13, color: "#9C8676", lineHeight: 1.7 }}>
            Comienza agregando tus materiales en Inventario,<br />
            luego crea tus recetas y registra tus pedidos.
          </div>
        </div>
      )}

    </div>
  );
}

// ─── MÓDULO: Backup ───────────────────────────────────────────────────────────
function BackupModule({ data, onImport, toast, onClose }) {
  const [importText, setImportText] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [confirmImport, setConfirmImport] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);

  const resetear = () => {
    onImport(DEFAULTS);
    toast("🧹 App reiniciada — todos los datos fueron borrados");
  };

  const exportar = () => {
    const payload = JSON.stringify({ _v: "reposteria_v7", ts: Date.now(), ...data });
    const encoded = btoa(unescape(encodeURIComponent(payload)));
    abrirWhatsApp(null, `🍰 BACKUP Repostería\n${encoded}`);
    toast("📤 Abriendo WhatsApp…");
  };

  const copiar = () => {
    const payload = JSON.stringify({ _v: "reposteria_v7", ts: Date.now(), ...data });
    const encoded = btoa(unescape(encodeURIComponent(payload)));
    navigator.clipboard && navigator.clipboard.writeText(`🍰 BACKUP Repostería\n${encoded}`).then(() => toast("📋 Copiado"));
  };

  const importar = () => {
    try {
      const lines = importText.trim().split("\n");
      const raw   = lines.find(l => !l.startsWith("🍰") && l.trim().length > 10) || importText.trim();
      const obj   = JSON.parse(decodeURIComponent(escape(atob(raw.trim()))));
      if (!obj._v && obj._v.includes("reposteria")) throw new Error();
      const { _v, ts, ...restored } = obj;
      onImport(restored); setImportText(""); setShowImport(false); toast("✅ Datos restaurados");
    } catch { toast("❌ Código inválido."); }
  };

  const kb     = (JSON.stringify(data).length / 1024).toFixed(0);
  const grande = +kb > 400;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <button
          onClick={onClose}
          style={{ background: "#FFFFFF", border: "1px solid #EADFD3", borderRadius: 10, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#D69B7A", fontSize: 16, fontFamily: "inherit", flexShrink: 0 }}
        >
          ←
        </button>
        <h2 style={{ margin: 0, fontSize: 21, color: "#3D2B24", fontFamily: "'Fraunces',serif", fontWeight: 600 }}>Backup & Transferencia</h2>
      </div>
      {grande && <div style={{ ...S.card, borderColor: "#C6822A66", background: "#FBF0DC" }}><div style={{ fontSize: 13, color: "#D99A34" }}>⚠️ Backup ~{kb} KB. Si WhatsApp falla, usa "Copiar código".</div></div>}
      <div style={{ ...S.card, borderColor: "#6B8E6366" }}>
        <div style={{ fontWeight: 700, color: "#6B8E63", fontSize: 15, marginBottom: 8 }}>📤 Exportar</div>
        <div style={{ fontSize: 13, color: "#8A7A6D", marginBottom: 14 }}>Genera un código con todos tus datos para restaurar en otro dispositivo.</div>
        <div style={{ display: "flex", gap: 8 }}><Btn v="success" onClick={exportar}>📱 WhatsApp</Btn><Btn v="ghost" onClick={copiar}>📋 Copiar código</Btn></div>
      </div>
      <div style={{ ...S.card, borderColor: "#6B7BA666" }}>
        <div style={{ fontWeight: 700, color: "#7C8BA6", fontSize: 15, marginBottom: 8 }}>📥 Importar</div>
        <div style={{ fontSize: 13, color: "#8A7A6D", marginBottom: 14 }}>Pega el código recibido.<br /><span style={{ color: "#C94F4F" }}>⚠️ Reemplazará los datos actuales.</span></div>
        {!showImport
          ? <Btn v="ghost" onClick={() => setShowImport(true)}>📥 Restaurar desde código</Btn>
          : <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <textarea value={importText} onChange={e => setImportText(e.target.value)} placeholder="Pega aquí el texto completo…" style={{ ...S.inp, minHeight: 110, resize: "vertical", lineHeight: 1.5 }} />
              <div style={{ display: "flex", gap: 8 }}><Btn onClick={() => setConfirmImport(true)}>Restaurar</Btn><Btn v="ghost" onClick={() => { setShowImport(false); setImportText(""); }}>Cancelar</Btn></div>
            </div>
        }
      </div>
      <div style={{ ...S.card }}>
        <div style={{ fontSize: 12, color: "#9C8676", fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 12 }}>Resumen</div>
        {[["Materiales", data.materiales.length], ["Recetas", data.recetas.length], ["Pedidos", data.pedidos.length], ["Movimientos en fondo", data.fondo.movimientos.length]].map(([k, v]) => (
          <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "6px 0", borderBottom: "1px solid #F5EAE0", color: "#8A7A6D" }}><span>{k}</span><span style={{ color: "#D69B7A", fontWeight: 700 }}>{v}</span></div>
        ))}
        <div style={{ fontSize: 11, color: "#B5A695", marginTop: 12 }}>Tamaño: <span style={{ color: grande ? "#C94F4F" : "#6B8E63" }}>{kb} KB</span> · 100% offline · guardado automático.</div>
      </div>

      <div style={{ ...S.card, borderColor: "#C94F4F66", background: "#FBEAEA" }}>
        <div style={{ fontWeight: 700, color: "#C94F4F", fontSize: 15, marginBottom: 8 }}>🧹 Reiniciar app</div>
        <div style={{ fontSize: 13, color: "#8A7A6D", marginBottom: 14 }}>
          Borra materiales, recetas, pedidos y fondo — la app queda como nueva.<br />
          <span style={{ color: "#8FAE87" }}>✓ No se pedirá el código de activación de nuevo.</span>
        </div>
        <Btn v="danger" onClick={() => setConfirmReset(true)}>🧹 Borrar todos los datos</Btn>
      </div>

      {/* Confirmación de importación destructiva */}
      {confirmImport && (
        <ConfirmModal
          icon="📥"
          title="¿Reemplazar todos los datos?"
          message="Esto sobrescribirá materiales, recetas, pedidos y el fondo actuales con los del código importado. No se puede deshacer."
          confirmLabel="Sí, reemplazar"
          onCancel={() => setConfirmImport(false)}
          onConfirm={() => { importar(); setConfirmImport(false); }}
        />
      )}

      {/* Confirmación de reinicio total */}
      {confirmReset && (
        <ConfirmModal
          icon="🧹"
          title="¿Borrar todos los datos?"
          message="Se eliminarán materiales, recetas, pedidos y el fondo de caja. La activación de la app NO se pierde. Esta acción no se puede deshacer — considera exportar un backup antes si no estás seguro."
          confirmLabel="Sí, borrar todo"
          onCancel={() => setConfirmReset(false)}
          onConfirm={() => { resetear(); setConfirmReset(false); onClose(); }}
        />
      )}
    </div>
  );
}

// ─── BÚSQUEDA GLOBAL ──────────────────────────────────────────────────────────
function BusquedaGlobal({ materiales, recetas, pedidos, fondo, setTab, onClose }) {
  const [query, setQuery] = useState("");
  const inputRef = useRef(null);

  useEffect(() => {
    if (inputRef.current) inputRef.current.focus();
  }, []);

  const q = query.trim().toLowerCase();

  const resultados = React.useMemo(() => {
    if (!q || q.length < 1) return {};

    const grupos = {};

    // ── Materiales ──
    const mats = materiales.filter(m =>
      m.nombre.toLowerCase().includes(q) ||
      (m.tipo || "").toLowerCase().includes(q) ||
      (m.unidad || "").toLowerCase().includes(q)
    ).map(m => {
      const stock = stockMaterial(m);
      const pp    = precioPromedio(m.compras);
      return {
        id: m.id,
        titulo: m.nombre,
        subtitulo: `${m.tipo} · Stock: ${stock.toFixed(2)} ${m.unidad}`,
        extra: pp > 0 ? `$${pp.toFixed(4)}/${m.unidad}` : "Sin precio",
        color: "#5B8A9E",
        icono: "🧂",
        tab: "materiales",
      };
    });
    if (mats.length) grupos["Inventario"] = mats;

    // ── Recetas ──
    const recs = recetas.filter(r =>
      r.nombre.toLowerCase().includes(q) ||
      (r.descripcion || "").toLowerCase().includes(q) ||
      r.ingredientes.some(ing => {
        const mat = materiales.find(m => m.id === ing.matId);
        return mat && mat.nombre.toLowerCase().includes(q);
      })
    ).map(r => {
      const costo = costoReceta(r, materiales);
      return {
        id: r.id,
        titulo: r.nombre,
        subtitulo: r.descripcion || `${r.ingredientes.length} ingrediente(s)`,
        extra: `Costo: $${f2(costo)} · Precio: $${f2(costo * (1 + r.margen))}`,
        color: "#D69B7A",
        icono: "📋",
        tab: "recetas",
      };
    });
    if (recs.length) grupos["Recetas"] = recs;

    // ── Pedidos ──
    const peds = pedidos.filter(p =>
      p.cliente.toLowerCase().includes(q) ||
      (p.telefono || "").toLowerCase().includes(q) ||
      (p.nota || "").toLowerCase().includes(q) ||
      (() => { const r = recetas.find(x => x.id === p.recetaId); return r && r.nombre.toLowerCase().includes(q); })() ||
      (p.estado || "").toLowerCase().includes(q) ||
      (ESTADOS[p.estado] && ESTADOS[p.estado].label.toLowerCase().includes(q))
    ).map(p => {
      const r = recetas.find(x => x.id === p.recetaId);
      const estadoInfo = ESTADOS[p.estado] || { label: p.estado, color: "#A69686" };
      return {
        id: p.id,
        titulo: p.cliente,
        subtitulo: `${(r && r.nombre) || "—"} × ${p.cantidad} · ${p.fechaEntrega}`,
        extra: estadoInfo.label,
        extraColor: estadoInfo.color,
        color: "#6B8E63",
        icono: "🎂",
        tab: "pedidos",
      };
    });
    if (peds.length) grupos["Pedidos"] = peds;

    // ── Compras (dentro de materiales) ──
    const compras = [];
    materiales.forEach(m => {
      (m.compras || []).forEach(c => {
        if (
          (c.nota || "").toLowerCase().includes(q) ||
          (c.fecha || "").includes(q) ||
          m.nombre.toLowerCase().includes(q)
        ) {
          const monto = c.precioTotal || c.cantidad * c.precio;
          compras.push({
            id: c.id,
            titulo: `Compra: ${m.nombre}`,
            subtitulo: `${c.fecha} · ${c.cantidadOriginal || c.cantidad.toFixed(4)} ${c.unidadOriginal || m.unidad}`,
            extra: `$${f2(monto)}`,
            color: "#D99A34",
            icono: "📦",
            tab: "materiales",
            nota: c.nota,
          });
        }
      });
    });
    // Deduplicar compras que ya aparecen por el material
    const comprasFiltradas = compras.filter((c, i, arr) => arr.findIndex(x => x.id === c.id) === i);
    if (comprasFiltradas.length) grupos["Compras"] = comprasFiltradas;

    // ── Movimientos de caja ──
    const movs = (fondo.movimientos || []).filter(m =>
      m.descripcion.toLowerCase().includes(q) ||
      (m.fecha || "").includes(q) ||
      (m.tipo || "").toLowerCase().includes(q)
    ).map(m => {
      const icono = m.tipo === "venta" ? "💰" : m.tipo === "compra" ? "📦" : m.monto > 0 ? "💵" : "💸";
      return {
        id: m.id,
        titulo: m.descripcion,
        subtitulo: `${m.fecha} · ${m.tipo}`,
        extra: `${m.monto >= 0 ? "+" : ""}$${f2(m.monto)}`,
        extraColor: m.monto >= 0 ? "#6B8E63" : "#C94F4F",
        color: "#7C8BA6",
        icono,
        tab: "fondo",
      };
    });
    if (movs.length) grupos["Caja / Fondo"] = movs;

    return grupos;
  }, [q, materiales, recetas, pedidos, fondo]);

  const total = Object.values(resultados).reduce((s, arr) => s + arr.length, 0);
  const sinResultados = q.length >= 1 && total === 0;

  const irA = (tab) => {
    setTab(tab);
    onClose();
  };

  return (
    <div
      style={{ position: "fixed", inset: 0, background: "#2A1810b3", zIndex: 300, display: "flex", flexDirection: "column", alignItems: "center", padding: "0 0 40px" }}
      onClick={e => e.target === e.currentTarget && onClose()}
    >
      {/* Barra de búsqueda */}
      <div style={{ width: "100%", maxWidth: 680, padding: "16px 16px 0" }}>
        <div style={{ position: "relative" }}>
          <span style={{ position: "absolute", left: 16, top: "50%", transform: "translateY(-50%)", fontSize: 18, color: "#C97A54", pointerEvents: "none" }}>🔍</span>
          <input
            ref={inputRef}
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Buscar en toda la app…"
            style={{
              ...S.inp,
              paddingLeft: 48,
              paddingRight: 48,
              fontSize: 17,
              height: 54,
              borderRadius: 16,
              background: "#FFFFFF",
              border: "1.5px solid #B5542F",
              boxShadow: "0 0 0 4px #B5542F22",
            }}
          />
          {query ? (
            <button onClick={() => setQuery("")} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "#EADFD3", border: "none", color: "#C97A54", borderRadius: 8, width: 28, height: 28, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
          ) : (
            <button onClick={onClose} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#A69686", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>ESC</button>
          )}
        </div>

        {/* Hint */}
        {!q && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 14 }}>
            {["materiales", "recetas", "pedidos", "compras", "fondo"].map(hint => (
              <button key={hint} onClick={() => setQuery(hint)} style={{ background: "#FFFFFF", border: "1px solid #EADFD3", color: "#9C8676", borderRadius: 20, padding: "4px 13px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
                {hint}
              </button>
            ))}
          </div>
        )}
      </div>

      {/* Resultados */}
      <div style={{ width: "100%", maxWidth: 680, flex: 1, overflowY: "auto", padding: "16px 16px 0", display: "flex", flexDirection: "column", gap: 20 }}>

        {/* Contador */}
        {q && total > 0 && (
          <div style={{ fontSize: 12, color: "#9C8676", fontWeight: 600 }}>
            {total} resultado{total !== 1 ? "s" : ""} para «<span style={{ color: "#3D2B24" }}>{query}</span>»
          </div>
        )}

        {/* Sin resultados */}
        {sinResultados && (
          <div style={{ textAlign: "center", padding: "40px 20px" }}>
            <div style={{ fontSize: 36, marginBottom: 10 }}>🔎</div>
            <div style={{ color: "#9C8676", fontSize: 14 }}>Sin resultados para «<b style={{ color: "#3D2B24" }}>{query}</b>»</div>
            <div style={{ color: "#B5A695", fontSize: 12, marginTop: 6 }}>Intenta con otro término</div>
          </div>
        )}

        {/* Grupos de resultados */}
        {Object.entries(resultados).map(([grupo, items]) => (
          <div key={grupo}>
            {/* Cabecera del grupo */}
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <div style={{ fontSize: 11, color: "#9C8676", fontWeight: 700, letterSpacing: 0.8, textTransform: "uppercase" }}>{grupo}</div>
              <div style={{ flex: 1, height: 1, background: "#EADFD3" }} />
              <div style={{ fontSize: 11, color: "#B5A695", background: "#FFFFFF", border: "1px solid #EADFD3", borderRadius: 10, padding: "1px 8px" }}>{items.length}</div>
            </div>

            {/* Items del grupo */}
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {items.map(item => (
                <button
                  key={item.id}
                  onClick={() => irA(item.tab)}
                  style={{ background: "#FFFFFF", border: "1px solid #EADFD3", borderRadius: 12, padding: "12px 16px", cursor: "pointer", fontFamily: "inherit", textAlign: "left", width: "100%", display: "flex", alignItems: "center", gap: 14, transition: "border-color .15s, background .15s" }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = item.color + "66"; e.currentTarget.style.background = "#F5EAE0"; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = "#EADFD3"; e.currentTarget.style.background = "#FFFFFF"; }}
                >
                  {/* Icono */}
                  <div style={{ width: 40, height: 40, borderRadius: 10, background: item.color + "18", border: `1px solid ${item.color}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>
                    {item.icono}
                  </div>

                  {/* Texto */}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#3D2B24", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      <HighlightText text={item.titulo} query={q} />
                    </div>
                    <div style={{ fontSize: 12, color: "#9C8676", marginTop: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      <HighlightText text={item.subtitulo} query={q} />
                    </div>
                    {item.nota && (
                      <div style={{ fontSize: 11, color: "#A69686", marginTop: 1, fontStyle: "italic" }}>💬 {item.nota}</div>
                    )}
                  </div>

                  {/* Extra / precio */}
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: item.extraColor || item.color }}>{item.extra}</div>
                    <div style={{ fontSize: 10, color: "#B5A695", marginTop: 2 }}>→ {item.tab === "materiales" ? "Inventario" : item.tab === "recetas" ? "Recetas" : item.tab === "pedidos" ? "Pedidos" : "Fondo"}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        ))}

        {/* Spacer bottom */}
        {total > 0 && <div style={{ height: 20 }} />}
      </div>
    </div>
  );
}

function HighlightText({ text, query }) {
  if (!query || !text) return <>{text}</>;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return <>{text}</>;
  return (
    <>
      {text.slice(0, idx)}
      <mark style={{ background: "#B5542F44", color: "#3D2B24", borderRadius: 3, padding: "0 2px" }}>
        {text.slice(idx, idx + query.length)}
      </mark>
      {text.slice(idx + query.length)}
    </>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App() {
  const init = loadData();
  const [materiales, setMateriales] = useState(init.materiales || []);
  const [recetas,    setRecetas]    = useState(init.recetas    || []);
  const [pedidos,    setPedidos]    = useState(init.pedidos    || []);
  const [fondo,      setFondo]      = useState(init.fondo      || DEFAULTS.fondo);
  const [tab,        setTab]        = useState("dashboard");
  const [toastMsg,   setToastMsg]   = useState(null);
  const [showBusq,   setShowBusq]   = useState(false);
  const contentRef = useRef(null);
  const touchRef    = useRef({ x: 0, y: 0, active: false });

  // ── Tema día/noche automático según horario ──────────────────────────────
  // La app está diseñada en cálido/claro por defecto (de día). De noche
  // (19:00–6:00) se aplica el filtro de inversión para pasar a una variante
  // oscura cálida, más cómoda para los ojos.
  const esHorarioNoche = () => { const h = new Date().getHours(); return h >= 19 || h < 6; };
  const [temaNoche, setTemaNoche] = useState(esHorarioNoche());
  const overrideRef = useRef(null); // null = automático; true/false = forzado manualmente

  useEffect(() => {
    // Revisa cada minuto si cambió el tramo horario, para transicionar sola la app.
    // Si el usuario forzó el tema manualmente, se respeta hasta que el horario
    // natural vuelva a coincidir con esa elección (entonces se libera el override).
    const id = setInterval(() => {
      const auto = esHorarioNoche();
      if (overrideRef.current === null) { setTemaNoche(auto); return; }
      if (overrideRef.current === auto) { overrideRef.current = null; setTemaNoche(auto); }
    }, 60000);
    return () => clearInterval(id);
  }, []);

  const toggleTema = () => {
    setTemaNoche(t => {
      const nuevo = !t;
      overrideRef.current = nuevo;
      return nuevo;
    });
  };

  useEffect(() => {
    document.body.classList.toggle("tema-claro", temaNoche);
    document.getElementById("root").classList.toggle("tema-claro", temaNoche);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", temaNoche ? "#130B04" : "#FBF3EC");
  }, [temaNoche]);

  // ── Corrige emojis bajo el filtro de inversión del tema noche ──
  // Recorre nodos de texto y envuelve los emojis en un span con filtro
  // contrario, así mantienen su color natural en vez de quedar invertidos.
  useEffect(() => {
    if (!temaNoche) return;
    const RE_EMOJI = /([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}])/gu;
    const procesar = () => {
      const root = document.getElementById("root");
      if (!root) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: (node) => {
          if (!node.nodeValue || !RE_EMOJI.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
          if (node.parentElement && node.parentElement.classList.contains("emoji-fix")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        },
      });
      const nodos = [];
      let n;
      while ((n = walker.nextNode())) nodos.push(n);
      nodos.forEach(node => {
        const partes = node.nodeValue.split(RE_EMOJI);
        if (partes.length <= 1) return;
        const frag = document.createDocumentFragment();
        partes.forEach(parte => {
          if (!parte) return;
          if (RE_EMOJI.test(parte) && parte.length <= 2) {
            const span = document.createElement("span");
            span.className = "emoji-fix";
            span.textContent = parte;
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(parte));
          }
        });
        node.parentNode && node.parentNode.replaceChild(frag, node);
      });
    };
    // Pequeño delay para correr después de que React termine de pintar
    const t = setTimeout(procesar, 50);
    // Observa cambios futuros del DOM (navegación entre tabs, listas, etc.)
    const obs = new MutationObserver(() => { clearTimeout(window.__emojiFixT); window.__emojiFixT = setTimeout(procesar, 60); });
    const rootEl = document.getElementById("root");
    if (rootEl) obs.observe(rootEl, { childList: true, subtree: true, characterData: true });
    return () => { clearTimeout(t); clearTimeout(window.__emojiFixT); obs.disconnect(); };
  }, [temaNoche, tab, showBusq]);

  // Atajo de teclado: Ctrl+K o Cmd+K
  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); setShowBusq(s => !s); }
      if (e.key === "Escape") setShowBusq(false);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const toast = (msg) => setToastMsg(msg);

  useEffect(() => { saveData({ materiales, recetas, pedidos, fondo }); }, [materiales, recetas, pedidos, fondo]);

  const onImport = (d) => {
    setMateriales(d.materiales || []);
    setRecetas(d.recetas    || []);
    setPedidos(d.pedidos    || []);
    setFondo(d.fondo        || DEFAULTS.fondo);
  };

  // ── Entregas urgentes: hoy o atrasadas, y aún no entregadas ──
  const entregasUrgentes = pedidos.filter(p => {
    if (p.estado === "entregado" || !p.fechaEntrega) return false;
    const dias = Math.ceil((new Date(p.fechaEntrega) - new Date()) / 86400000);
    return dias <= 1;
  }).length;

  // Orden de navegación principal (usado para swipe y bottom-nav)
  const TABS = [
    { id: "dashboard",  label: "Inicio",     icon: "🏠" },
    { id: "materiales", label: "Inventario", icon: "🧂" },
    { id: "recetas",    label: "Recetas",    icon: "📋" },
    { id: "pedidos",    label: "Pedidos",    icon: "🎂", badge: entregasUrgentes },
    { id: "fondo",      label: "Fondo",      icon: "🏦" },
  ];
  const ALL_TABS = [...TABS, { id: "backup", label: "Backup", icon: "📲" }];

  const tabIdx     = TABS.findIndex(t => t.id === tab);
  const idxValido  = tabIdx >= 0; // backup no participa del swipe (es secundario)

  const irRelativo = (delta) => {
    if (!idxValido) return;
    const next = tabIdx + delta;
    if (next >= 0 && next < TABS.length) setTab(TABS[next].id);
  };

  // ── Gestos de swipe izquierda/derecha para cambiar de sección ──
  // Se ignoran los toques que empiezan sobre controles interactivos (sliders,
  // inputs, botones, selects) o dentro de cualquier modal, para que mover un
  // slider o seleccionar texto no se confunda con un gesto de navegación.
  const esElementoInteractivo = (el) => {
    let node = el;
    while (node && node !== document.body) {
      const tag = node.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || tag === "BUTTON" || tag === "LABEL") return true;
      if (node.getAttribute && node.getAttribute("role") === "slider") return true;
      // Cualquier modal (z-index alto, position fixed) bloquea el swipe del fondo
      if (node.dataset && node.dataset.noSwipe) return true;
      node = node.parentElement;
    }
    return false;
  };

  const onTouchStart = (e) => {
    if (showBusq) return;
    if (esElementoInteractivo(e.target)) { touchRef.current.active = false; return; }
    const t = e.touches[0];
    touchRef.current = { x: t.clientX, y: t.clientY, active: true };
  };
  const onTouchEnd = (e) => {
    if (!touchRef.current.active) return;
    touchRef.current.active = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchRef.current.x;
    const dy = t.clientY - touchRef.current.y;
    // Umbral: movimiento horizontal claro y mayor que el vertical (evita interferir con scroll)
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) irRelativo(1);   // swipe izquierda → siguiente sección
      else        irRelativo(-1); // swipe derecha → sección anterior
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: "#FBF3EC", color: "#3D2B24", fontFamily: "'Inter','Segoe UI',sans-serif", display: "flex", flexDirection: "column" }}>
      {/* Header */}
      <div style={{ background: "#FFFDF9", borderBottom: "1px solid #EADFD3", padding: "12px 20px", display: "flex", alignItems: "center", gap: 12, position: "sticky", top: 0, zIndex: 100 }}>
        <span style={{ fontSize: 26 }}>🍰</span>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 600, fontSize: 18, fontFamily: "'Fraunces',serif", background: "linear-gradient(90deg,#3D2B24,#C97A54)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>Mi Repostería</div>
          <div style={{ fontSize: 11, color: "#B5A695" }}>100% offline · guardado automático</div>
        </div>
        {/* Tema claro/oscuro (automático por horario, con override manual) */}
        <button
          onClick={toggleTema}
          title={temaNoche ? "Tema noche (auto 7pm-6am) — tocar para forzar día" : "Tema día (auto 6am-7pm) — tocar para forzar noche"}
          style={{ background: "#F5EAE0", border: "1px solid #E3D5C4", borderRadius: 10, width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#B5542F", fontSize: 16, fontFamily: "inherit" }}
        >
          <span className="emoji-fix">{temaNoche ? "🌙" : "☀️"}</span>
        </button>
        {/* Backup (secundario) */}
        <button
          onClick={() => setTab("backup")}
          title="Backup y transferencia"
          style={{ background: tab === "backup" ? "#B5542F22" : "#F5EAE0", border: `1px solid ${tab === "backup" ? "#B5542F" : "#E3D5C4"}`, borderRadius: 10, width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: tab === "backup" ? "#B5542F" : "#B5542F", fontSize: 16, fontFamily: "inherit" }}
        >
          📲
        </button>
        {/* Botón búsqueda global */}
        <button
          onClick={() => setShowBusq(true)}
          title="Búsqueda global (Ctrl+K)"
          style={{ background: "#F5EAE0", border: "1px solid #E3D5C4", borderRadius: 12, padding: "8px 14px", display: "flex", alignItems: "center", gap: 8, cursor: "pointer", color: "#8A7A6D", fontSize: 13, fontFamily: "inherit", transition: "border-color .2s, color .2s" }}
          onMouseEnter={e => { e.currentTarget.style.borderColor = "#B5542F"; e.currentTarget.style.color = "#3D2B24"; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor = "#E3D5C4"; e.currentTarget.style.color = "#8A7A6D"; }}
        >
          <span style={{ fontSize: 16 }}>🔍</span>
          <span style={{ fontSize: 10, background: "#EADFD3", borderRadius: 5, padding: "2px 5px", color: "#7A6A5C", fontWeight: 700, letterSpacing: 0.5 }}>⌘K</span>
        </button>
      </div>

      {/* Contenido (con gestos de swipe) */}
      <div
        ref={contentRef}
        onTouchStart={onTouchStart}
        onTouchEnd={onTouchEnd}
        style={{ flex: 1, padding: "20px 16px 96px", maxWidth: 1080, margin: "0 auto", width: "100%", boxSizing: "border-box" }}
      >
        {tab === "dashboard"  && <Dashboard   materiales={materiales} recetas={recetas} pedidos={pedidos} fondo={fondo} setTab={setTab} />}
        {tab === "materiales" && <MaterialesModule materiales={materiales} setMateriales={setMateriales} fondo={fondo} setFondo={setFondo} toast={toast} />}
        {tab === "recetas"    && <RecetasModule recetas={recetas} setRecetas={setRecetas} materiales={materiales} toast={toast} />}
        {tab === "pedidos"    && <PedidosModule pedidos={pedidos} setPedidos={setPedidos} recetas={recetas} materiales={materiales} setMateriales={setMateriales} fondo={fondo} setFondo={setFondo} toast={toast} />}
        {tab === "fondo"      && <FondoModule  fondo={fondo} setFondo={setFondo} toast={toast} />}
        {tab === "backup"     && <BackupModule data={{ materiales, recetas, pedidos, fondo }} onImport={onImport} toast={toast} onClose={() => setTab("dashboard")} />}
      </div>

      {/* Bottom navigation fija */}
      <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, background: "#FFFDF9", borderTop: "1px solid #EADFD3", display: "flex", zIndex: 150, paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        {TABS.map(t => {
          const activo = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                flex: 1, background: "transparent", border: "none", cursor: "pointer", fontFamily: "inherit",
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                gap: 2, padding: "9px 2px 8px", color: activo ? "#D69B7A" : "#A69686", transition: "color .15s",
                position: "relative",
              }}
            >
              <span style={{ position: "relative", display: "inline-block" }}>
                <span style={{ fontSize: 20, lineHeight: 1, filter: activo ? "none" : "grayscale(40%) opacity(0.8)" }}>{t.icon}</span>
                {!!t.badge && (
                  <span className="emoji-fix" style={{ position: "absolute", top: -4, right: -8, background: "#C94F4F", color: "#FFFFFF", fontSize: 9, fontWeight: 800, borderRadius: 8, minWidth: 15, height: 15, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px", border: "1.5px solid #FFFDF9", lineHeight: 1 }}>
                    {t.badge > 9 ? "9+" : t.badge}
                  </span>
                )}
              </span>
              <span style={{ fontSize: 10, fontWeight: activo ? 700 : 500 }}>{t.label}</span>
              <span style={{ width: activo ? 18 : 0, height: 2, borderRadius: 2, background: "#C97A54", marginTop: 1, transition: "width .2s" }} />
            </button>
          );
        })}
      </div>

      {toastMsg && <Toast msg={toastMsg} onDone={() => setToastMsg(null)} />}

      {/* Búsqueda global */}
      {showBusq && (
        <BusquedaGlobal
          materiales={materiales}
          recetas={recetas}
          pedidos={pedidos}
          fondo={fondo}
          setTab={setTab}
          onClose={() => setShowBusq(false)}
        />
      )}
    </div>
  );
}


// ── Control de acceso: muestra la pantalla de activación si no hay licencia ──
function AppGate() {
  const [licencia, setLicencia] = useState(getLicenciaActiva());
  if (!licencia) {
    return <PantallaActivacion onActivar={() => setLicencia(getLicenciaActiva())} />;
  }
  return <App />;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(AppGate)
);

setTimeout(function() {
  var splash = document.getElementById('splash');
  if (splash) {
    splash.classList.add('oculto');
    setTimeout(function() { splash.remove(); }, 600);
  }
}, 500);

</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js')
      .then(function(r) { console.log('SW activo:', r.scope); })
      .catch(function(e) { console.warn('SW error:', e); });
  });
}
</script>
